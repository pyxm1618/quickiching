<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Quick I Ching">
  <style>
    .mark { fill: #242424; }
    @media (prefers-color-scheme: dark) { .mark { fill: #f7f0dc; } }
  </style>
  <defs>
    <mask id="ink" mask-type="alpha">
      <image href="data:image/png;base64," width="128" height="128"/>
    </mask>
  </defs>
  <rect class="mark" width="128" height="128" mask="url(#ink)"/>
</svg>
