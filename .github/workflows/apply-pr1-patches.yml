name: apply-pr1-patches

on:
  push:
    branches:
      - agent/v2-1-reveal-intent

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-reveal-intent
          fetch-depth: 0
      - name: Apply exact reviewed replacements
        run: python3 scripts/apply-pr1-text-patches.py
      - name: Commit patched integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate secure reveal service"
          git push origin HEAD:agent/v2-1-reveal-intent
