name: Payment closeout refund postgres patch

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths: [.github/workflows/payment-closeout-refund-postgres-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/waffo-payment-closeout
      - name: Fix refund PostgreSQL root causes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/server/refunds/postgres-refund-repository.ts')
          source = path.read_text()
          start = source.index('  async claimProviderDispatch(')
          end = source.index('\n  async markProviderDispatchConfirmed(', start)
          method = source[start:end]

          old = '    return this.sql.begin(async (transaction) => {'
          if method.count(old) != 1:
              raise SystemExit(f'claim begin count={method.count(old)}')
          method = method.replace(old, '    const result = await this.sql.begin(async (transaction) => {', 1)

          old = '        return dispatchClaim(order, refund, "read_only");'
          if method.count(old) != 1:
              raise SystemExit(f'initial read-only count={method.count(old)}')
          method = method.replace(old, '        return { blocked: false as const, claim: dispatchClaim(order, refund, "read_only") };', 1)

          old = '        throw new Error("REFUND_ENTITLEMENTS_NOT_FULLY_AVAILABLE");'
          if method.count(old) != 1:
              raise SystemExit(f'blocked throw count={method.count(old)}')
          method = method.replace(old, '        return { blocked: true as const };', 1)

          old = '        return dispatchClaim(order, latestRows[0], "read_only");'
          if method.count(old) != 1:
              raise SystemExit(f'late read-only count={method.count(old)}')
          method = method.replace(old, '        return { blocked: false as const, claim: dispatchClaim(order, latestRows[0], "read_only") };', 1)

          old = '      return dispatchClaim(order, updated[0], "dispatch");\n    });'
          if method.count(old) != 1:
              raise SystemExit(f'dispatch tail count={method.count(old)}')
          method = method.replace(old, '''      return { blocked: false as const, claim: dispatchClaim(order, updated[0], "dispatch") };
    });
    if (result.blocked) throw new Error("REFUND_ENTITLEMENTS_NOT_FULLY_AVAILABLE");
    return result.claim;''', 1)

          source = source[:start] + method + source[end:]
          old = '            next_reconcile_at = ${failed ? null : input.now},'
          if source.count(old) != 1:
              raise SystemExit(f'confirmed next_reconcile count={source.count(old)}')
          source = source.replace(old, '            next_reconcile_at = ${failed ? null : input.now.toISOString()},', 1)
          path.write_text(source)

          Path('.github/workflows/payment-closeout-refund-postgres-patch.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(refund): preserve blocked dispatch state"
          git push origin HEAD:fix/waffo-payment-closeout
