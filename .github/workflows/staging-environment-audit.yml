name: Staging Environment Audit

on:
  push:
    branches:
      - fix/final-production-remediation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-environment-audit
  cancel-in-progress: true

env:
  VERCEL_PROJECT_ID: prj_iKtw9xKmIlEfe44gEocgLr2QDLfE
  VERCEL_TEAM_ID: team_z1b9TTQtbNkr43dzs5JVJPnQ
  STAGING_ORIGIN: https://staging.quickiching.com

jobs:
  audit:
    name: Read-only staging deployment and environment audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
    steps:
      - name: Lock staging project scope
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_STAGING_TOKEN is not configured"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_iKtw9xKmIlEfe44gEocgLr2QDLfE"
          test "$VERCEL_TEAM_ID" = "team_z1b9TTQtbNkr43dzs5JVJPnQ"

      - name: Project git linkage
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}" \
            > "${RUNNER_TEMP}/project.json"
          jq '{name, framework, nodeVersion, link, gitProviderOptions, autoExposeSystemEnvs, createdAt, updatedAt}' "${RUNNER_TEMP}/project.json"

      - name: Recent production deployments
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&target=production&limit=10" \
            > "${RUNNER_TEMP}/deployments.json"
          jq '[.deployments[] | {
            id: .uid,
            url,
            created: (.createdAt / 1000 | todate),
            state: .readyState,
            source,
            creator: (.creator.username // null),
            commitSha: (.meta.githubCommitSha // null),
            commitRef: (.meta.githubCommitRef // null),
            commitMessage: (.meta.githubCommitMessage // null)
          }]' "${RUNNER_TEMP}/deployments.json"

      - name: Domain assignment
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_TEAM_ID}" \
            > "${RUNNER_TEMP}/domains.json"
          jq '[.domains[] | {name, productionBranch, gitBranch, redirect, verified, updatedAt}]' "${RUNNER_TEMP}/domains.json"

      - name: Production-target environment metadata
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" \
            > "${RUNNER_TEMP}/env.json"
          jq '[.envs[]
            | select((.target == "production") or ((.target | type) == "array" and (.target | index("production") != null)))
            | {key, type, target, hasValue: ((.value // "") | length > 0)}]' "${RUNNER_TEMP}/env.json"

      - name: Public analytics and origin values
        run: |
          set -euo pipefail
          jq '[.envs[]
            | select((.target == "production") or ((.target | type) == "array" and (.target | index("production") != null)))
            | select(.key | test("^(NEXT_PUBLIC_|APP_ENV$|APP_BASE_URL$|BETTER_AUTH_URL$|WAFFO_ENVIRONMENT$)"))
            | {key, value: (.value // "(masked-or-empty)")}]' "${RUNNER_TEMP}/env.json"

      - name: Live staging robots and analytics
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "${STAGING_ORIGIN}/robots.txt" || true
          curl --fail-with-body --silent --show-error -D "${RUNNER_TEMP}/headers.txt" "${STAGING_ORIGIN}/" -o "${RUNNER_TEMP}/home.html"
          grep -iE '^(x-robots-tag|x-vercel-cache|age):' "${RUNNER_TEMP}/headers.txt" || true
          grep -oE 'G-[A-Z0-9]{6,}|clarityProjectId[^,<]{0,80}|<meta[^>]+name="robots"[^>]*>' "${RUNNER_TEMP}/home.html" | sort -u | head -20

  isolation:
    name: Read-only staging vs production isolation fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
      PRODUCTION_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Compare runtime identities without disclosing values
        run: |
          set -euo pipefail
          test -n "${STAGING_TOKEN:-}" || { echo "::error::VERCEL_STAGING_TOKEN is not configured"; exit 1; }
          test -n "${PRODUCTION_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_iKtw9xKmIlEfe44gEocgLr2QDLfE"
          test "$VERCEL_TEAM_ID" = "team_z1b9TTQtbNkr43dzs5JVJPnQ"

          fetch_env() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/json" \
              "https://api.vercel.com/v10/projects/$2/env?teamId=${VERCEL_TEAM_ID}&decrypt=true&source=vercel-cli:pull"
          }
          fetch_env "$STAGING_TOKEN" "$VERCEL_PROJECT_ID" > "${RUNNER_TEMP}/staging-env.json"
          fetch_env "$PRODUCTION_TOKEN" "prj_pCpeoAys2GOqKZvkbLugYjpJWZBS" > "${RUNNER_TEMP}/prod-env.json"

          map_env() {
            jq '[.envs[]
              | select((.target == "production") or ((.target | type) == "array" and (.target | index("production") != null)))
              | {key, value: (.value // "")}] | from_entries' "$1"
          }
          map_env "${RUNNER_TEMP}/staging-env.json" > "${RUNNER_TEMP}/staging-map.json"
          map_env "${RUNNER_TEMP}/prod-env.json" > "${RUNNER_TEMP}/prod-map.json"

          echo "stagingProductionTargetKeys:"
          jq -r 'keys[]' "${RUNNER_TEMP}/staging-map.json" | sort

          compare_key() {
            local key="$1" sv pv sr=false pr=false same=false
            sv=$(jq -r --arg k "$key" '.[$k] // ""' "${RUNNER_TEMP}/staging-map.json")
            pv=$(jq -r --arg k "$key" '.[$k] // ""' "${RUNNER_TEMP}/prod-map.json")
            [ -n "$sv" ] && sr=true
            [ -n "$pv" ] && pr=true
            if [ "$sr" = true ] && [ "$pr" = true ]; then
              if [ "$(printf %s "$sv" | sha256sum | cut -d' ' -f1)" = "$(printf %s "$pv" | sha256sum | cut -d' ' -f1)" ]; then
                same=true
              fi
            fi
            printf '%-42s stagingReadable=%s productionReadable=%s sameHash=%s\n' "$key" "$sr" "$pr" "$same"
          }
          for key in DATABASE_URL DATABASE_URL_UNPOOLED BETTER_AUTH_SECRET AUTH_SECRET \
            RESEND_API_KEY TURNSTILE_SECRET_KEY AI_GATEWAY_API_KEY \
            WAFFO_API_KEY WAFFO_WEBHOOK_SECRET WAFFO_MERCHANT_ID; do
            compare_key "$key"
          done

          for key in APP_BASE_URL BETTER_AUTH_URL NEXT_PUBLIC_APP_URL NEXT_PUBLIC_BETTER_AUTH_URL; do
            value=$(jq -r --arg k "$key" '.[$k] // ""' "${RUNNER_TEMP}/staging-map.json")
            if [ -n "$value" ]; then
              host=$(node -e 'try{console.log(new URL(process.argv[1]).host)}catch{console.log("unparseable")}' "$value")
              printf '%sHost=%s\n' "$key" "$host"
            fi
          done

          printf 'stagingGaMeasurementId=%s\n' "$(jq -r '.NEXT_PUBLIC_GA_MEASUREMENT_ID // ""' "${RUNNER_TEMP}/staging-map.json")"
          printf 'stagingClarityProjectId=%s\n' "$(jq -r '.NEXT_PUBLIC_CLARITY_PROJECT_ID // ""' "${RUNNER_TEMP}/staging-map.json")"
          printf 'stagingAppEnv=%s\n' "$(jq -r '.APP_ENV // ""' "${RUNNER_TEMP}/staging-map.json")"
          printf 'stagingWaffoEnvironment=%s\n' "$(jq -r '.WAFFO_ENVIRONMENT // ""' "${RUNNER_TEMP}/staging-map.json")"
          printf 'productionPricingPreview=%s\n' "$(jq -r '.CHINESE_INTERACTIVE_GATE_PRICING_PREVIEW // "<unset>"' "${RUNNER_TEMP}/prod-map.json")"

      - name: Staging readiness without exposing internals
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error -o "${RUNNER_TEMP}/ready.json" -w '%{http_code}' "${STAGING_ORIGIN}/api/ready" || true)
          printf 'stagingReadyStatus=%s\n' "$code"
          head -c 600 "${RUNNER_TEMP}/ready.json" || true
          echo
