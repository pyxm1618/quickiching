name: install-final-runtime-deps

on:
  push:
    branches:
      - agent/v2-1-jobs-release
    paths:
      - .github/workflows/install-final-runtime-deps.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-jobs-release
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun add ai@^6 workflow@latest
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: add AI SDK and Workflow SDK"
          git push origin HEAD:agent/v2-1-jobs-release
