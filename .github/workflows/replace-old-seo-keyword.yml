name: Replace old SEO keyword

on:
  push:
    branches:
      - agent/rename-quick-i-ching
    paths:
      - .github/workflows/replace-old-seo-keyword.yml

permissions:
  contents: write

jobs:
  replace-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rename branch
        uses: actions/checkout@v4
        with:
          ref: agent/rename-quick-i-ching
          fetch-depth: 0

      - name: Replace old phrase in tracked UTF-8 files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          replacements = (
              ("I CHING COIN", "QUICK I CHING"),
              ("I Ching Coin", "Quick I Ching"),
              ("i ching coin", "quick i ching"),
          )

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              if path == Path(".github/workflows/replace-old-seo-keyword.yml") or not path.is_file():
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Updated files:")
          for path in changed:
              print(f"- {path}")

          remaining = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode("utf-8"))
              if path == Path(".github/workflows/replace-old-seo-keyword.yml") or not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if "i ching coin" in text.casefold():
                  remaining.append(str(path))

          if remaining:
              raise SystemExit("Old phrase remains in: " + ", ".join(remaining))
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/replace-old-seo-keyword.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Replace old SEO keyword with quick i ching"
          git push origin HEAD:agent/rename-quick-i-ching
