name: CP6 Commercial V2 Staging Gates

on:
  pull_request:
    branches:
      - main
      - codex/commercial-v2-cp6
  push:
    branches:
      - codex/commercial-v2-cp6
      - codex/commercial-v2-cp6-repair
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp6-commercial-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, typecheck, unit, build, drizzle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Diff whitespace hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Migration sequence and hash integrity
        run: node scripts/check-migration-integrity.mjs
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Drizzle migration metadata check
        run: bunx drizzle-kit check

  postgres:
    name: PostgreSQL serial integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          PG_BINDIR="$(pg_config --bindir)"
          echo "$PG_BINDIR" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run serial PostgreSQL integration suite
        run: node scripts/test-postgres-serial.mjs
