name: Payment Closeout Staging Readonly Audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/waffo-payment-closeout
    paths:
      - .github/workflows/payment-closeout-staging-readonly.yml
      - scripts/payment-closeout-staging-readonly-audit.ts
      - scripts/payment-closeout-staging-waffo-read.ts
      - src/server/readiness/staging-runtime-diagnostics.ts
      - src/server/readiness/waffo-staging-catalog-read.ts
      - src/server/payments/waffo-product-readiness.ts

permissions:
  contents: read

concurrency:
  group: payment-closeout-staging-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read staging DB and Waffo authority without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify execution scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/waffo-payment-closeout"
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is missing"; exit 1; }

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Read authoritative Waffo Test catalog from staging project configuration
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/payment-closeout-staging-waffo-read.ts > staging-waffo-read.json
          jq . staging-waffo-read.json

      - name: Read authoritative staging configuration and database
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/payment-closeout-staging-readonly-audit.ts > staging-readonly-audit.json
          jq . staging-readonly-audit.json

      - name: Upload non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-closeout-staging-readonly-${{ github.sha }}
          path: |
            staging-waffo-read.json
            staging-readonly-audit.json
          if-no-files-found: warn
          retention-days: 14
