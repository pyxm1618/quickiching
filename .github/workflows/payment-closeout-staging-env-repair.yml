name: Payment Closeout Staging Env Repair

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths: [.github/workflows/payment-closeout-staging-env-repair.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-closeout-staging-env-repair
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_iKtw9xKmIlEfe44gEocgLr2QDLfE
  VERCEL_TEAM_ID: team_z1b9TTQtbNkr43dzs5JVJPnQ

jobs:
  repair:
    name: Repair exact staging payment env metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Lock staging scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_iKtw9xKmIlEfe44gEocgLr2QDLfE"
          test "$VERCEL_TEAM_ID" = "team_z1b9TTQtbNkr43dzs5JVJPnQ"

      - name: Repair APP_ENV, Waffo Test mapping, and operator credential
        shell: bash
        run: |
          set -euo pipefail
          envs_file="$RUNNER_TEMP/staging-envs.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" \
            > "$envs_file"

          resolve_id() {
            local key="$1"
            local ids count
            ids="$(jq -r --arg key "$key" '.envs[]? | select(.key == $key and ((.target == "production") or ((.target | type) == "array" and (.target | index("production") != null)))) | .id' "$envs_file")"
            count="$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" -gt 1 ]; then
              echo "::error::Duplicate staging Production env entries for ${key}"
              exit 1
            fi
            printf '%s' "$ids"
          }

          patch_plain() {
            local key="$1" value="$2" id payload
            id="$(resolve_id "$key")"
            payload="$(jq -n --arg key "$key" --arg value "$value" '{key:$key,value:$value,type:"plain",target:["production"],comment:"Quick I Ching payment closeout staging contract"}')"
            if [ -n "$id" ]; then
              curl --fail-with-body --silent --show-error \
                -X PATCH \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_TEAM_ID}" \
                >/dev/null
              echo "Updated ${key} for staging Production target."
            else
              curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" \
                >/dev/null
              echo "Created ${key} for staging Production target."
            fi
          }

          patch_plain APP_ENV staging
          patch_plain WAFFO_ENVIRONMENT test

          operator_id="$(resolve_id REFUND_OPERATOR_SECRET)"
          if [ -z "$operator_id" ]; then
            operator_secret="$(openssl rand -hex 48)"
            echo "::add-mask::${operator_secret}"
            payload="$(jq -n --arg value "$operator_secret" '{key:"REFUND_OPERATOR_SECRET",value:$value,type:"sensitive",target:["production"],comment:"Quick I Ching staging refund operator credential; rotate before operator E2E if needed"}')"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" \
              >/dev/null
            echo "Created independent REFUND_OPERATOR_SECRET for staging Production target."
          else
            echo "REFUND_OPERATOR_SECRET already exists; left unchanged."
          fi

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify repaired staging metadata without exposing values
        run: |
          bun install --frozen-lockfile >/dev/null
          bun scripts/payment-closeout-staging-env-audit.ts
