name: fix-pr3-nullability

on:
  push:
    branches:
      - agent/v2-1-recovery-lifecycles

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-recovery-lifecycles
      - run: python3 scripts/fix-pr3-nullability.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: narrow casting snapshot nullability"
          git push origin HEAD:agent/v2-1-recovery-lifecycles
