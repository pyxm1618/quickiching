name: Homepage TBT diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline Lighthouse trace
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout immutable baseline
        uses: actions/checkout@v4
        with:
          ref: d8199fb2f073dd3119259e9253d8c3d40e9b5ab0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Production build
        env:
          VERCEL_ENV: production
        run: bun run build

      - name: Start production server
        env:
          VERCEL_ENV: production
          PORT: "3000"
          HOSTNAME: 127.0.0.1
        run: |
          bun run start > /tmp/quickiching-next.log 2>&1 &
          echo $! > /tmp/quickiching-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/quickiching-next.log
          exit 1

      - name: Prepare Lighthouse
        run: |
          mkdir -p perf-baseline /tmp/lighthouse
          npm install --prefix /tmp/lighthouse lighthouse@latest
          echo "/tmp/lighthouse/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/lighthouse/node_modules/.bin/lighthouse --version

      - name: Local production baseline (3 runs)
        run: |
          for i in 1 2 3; do
            lighthouse http://127.0.0.1:3000/               --preset=desktop               --only-categories=performance               --output=json               --output-path="perf-baseline/local-run-${i}.json"               --save-assets               --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-extensions"               --quiet
          done

      - name: Canonical production baseline
        run: |
          lighthouse https://www.quickiching.com/             --preset=desktop             --only-categories=performance             --output=json             --output-path="perf-baseline/www-normal.json"             --save-assets             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-extensions"             --quiet

      - name: Canonical production with GA and Clarity blocked
        run: |
          lighthouse https://www.quickiching.com/             --preset=desktop             --only-categories=performance             --blocked-url-patterns="*googletagmanager.com*"             --blocked-url-patterns="*clarity.ms*"             --output=json             --output-path="perf-baseline/www-block-third-party.json"             --save-assets             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-extensions"             --quiet

      - name: Print performance evidence
        run: |
          python3 - <<'PY'
          import glob, json, statistics

          def load(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def audit_items(audit):
              details = as_dict(as_dict(audit).get("details"))
              items = details.get("items", [])
              return items if isinstance(items, list) else []

          def metric(audits, key):
              a = as_dict(as_dict(audits).get(key))
              return {
                  "numericValue": a.get("numericValue"),
                  "displayValue": a.get("displayValue"),
                  "score": a.get("score"),
              }

          def report(path):
              d = as_dict(load(path))
              a = as_dict(d.get("audits"))
              categories = as_dict(d.get("categories"))
              performance = as_dict(categories.get("performance"))
              return {
                  "path": path,
                  "lighthouseVersion": d.get("lighthouseVersion"),
                  "requestedUrl": d.get("requestedUrl"),
                  "finalDisplayedUrl": d.get("finalDisplayedUrl"),
                  "performance": performance.get("score"),
                  "fcp": metric(a, "first-contentful-paint"),
                  "lcp": metric(a, "largest-contentful-paint"),
                  "speedIndex": metric(a, "speed-index"),
                  "tbt": metric(a, "total-blocking-time"),
                  "cls": metric(a, "cumulative-layout-shift"),
                  "longTasks": audit_items(a.get("long-tasks")),
                  "mainThread": audit_items(a.get("mainthread-work-breakdown")),
                  "bootup": audit_items(a.get("bootup-time")),
                  "unusedJs": audit_items(a.get("unused-javascript")),
                  "thirdParty": audit_items(a.get("third-party-summary")),
              }

          locals_ = [report(p) for p in sorted(glob.glob("perf-baseline/local-run-*.json"))]
          for r in locals_:
              print("LOCAL_RUN", json.dumps(r, ensure_ascii=False))
          tbt_values = [r["tbt"]["numericValue"] for r in locals_ if r["tbt"]["numericValue"] is not None]
          perf_values = [r["performance"] * 100 for r in locals_ if r["performance"] is not None]
          if tbt_values:
              print("LOCAL_MEDIAN", json.dumps({
                  "tbt_ms": statistics.median(tbt_values),
                  "performance": statistics.median(perf_values) if perf_values else None,
              }))

          normal = report("perf-baseline/www-normal.json")
          blocked = report("perf-baseline/www-block-third-party.json")
          print("WWW_NORMAL", json.dumps(normal, ensure_ascii=False))
          print("WWW_BLOCKED", json.dumps(blocked, ensure_ascii=False))
          if normal["tbt"]["numericValue"] is not None and blocked["tbt"]["numericValue"] is not None:
              print("THIRD_PARTY_DELTA", json.dumps({
                  "normal_tbt_ms": normal["tbt"]["numericValue"],
                  "blocked_tbt_ms": blocked["tbt"]["numericValue"],
                  "delta_ms": normal["tbt"]["numericValue"] - blocked["tbt"]["numericValue"],
              }))
          PY

      - name: Upload raw Lighthouse reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-tbt-baseline
          path: perf-baseline/
          if-no-files-found: error
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/quickiching-next.pid ]; then
            kill "$(cat /tmp/quickiching-next.pid)" || true
          fi
