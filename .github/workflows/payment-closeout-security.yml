name: Payment Closeout Security Gate

on:
  push:
    branches: [fix/waffo-payment-closeout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency audit and closeout secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit high and critical dependency vulnerabilities
        run: bun audit --audit-level=high
      - name: Scan payment-closeout additions for plaintext secrets
        env:
          CLOSEOUT_BASE_SHA: 9c339f89510cc657734f7788d71ab928ab4ecb76
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          base = os.environ['CLOSEOUT_BASE_SHA']
          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', f'{base}...HEAD', '--',
               ':!bun.lock', ':!docs/PAYMENT_CLOSEOUT_RUNBOOK.md'],
              text=True,
          )
          added = '\n'.join(
              line[1:] for line in diff.splitlines()
              if line.startswith('+') and not line.startswith('+++')
          )
          patterns = {
              'private_key_pem': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'credentialed_database_url': re.compile(r'postgres(?:ql)?://[^\s/:]+:[^\s/@]+@', re.I),
              'github_token': re.compile(r'\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b'),
              'live_provider_token': re.compile(r'\b(?:sk_live|pk_live)_[A-Za-z0-9_-]{16,}\b'),
              'literal_private_key_assignment': re.compile(r'(?m)^\s*(?:WAFFO_PRIVATE_KEY|REFUND_OPERATOR_SECRET|BETTER_AUTH_SECRET|APP_SECRET)\s*=\s*[^\s#][^\n]*$'),
              'public_secret_env': re.compile(r'NEXT_PUBLIC_[A-Z0-9_]*(?:SECRET|PRIVATE_KEY|DATABASE_URL)\b'),
          }
          hits = [name for name, pattern in patterns.items() if pattern.search(added)]
          if hits:
              print('::error::Potential plaintext secret patterns found in payment closeout diff: ' + ', '.join(hits))
              sys.exit(1)
          print('Payment closeout plaintext-secret scan passed.')
          PY
