name: CP6 Controlled Staging Migration

on:
  workflow_dispatch:
  push:
    branches:
      - codex/commercial-v2-cp6-repair
    paths:
      - .github/workflows/cp6-staging-migrate.yml

permissions:
  contents: read

concurrency:
  group: cp6-controlled-staging-migration
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_iKtw9xKmIlEfe44gEocgLr2QDLfE
  VERCEL_PROJECT_NAME: quickiching-staging
  VERCEL_TEAM_ID: team_z1b9TTQtbNkr43dzs5JVJPnQ
  GITHUB_REPO_ID: "1317018295"
  STAGING_ORIGIN: https://staging.quickiching.com

jobs:
  migrate:
    name: Migrate staging DB and leave clean exact-SHA deployment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Lock execution scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is missing"; exit 1; }
          test "${GITHUB_REF_NAME}" = "codex/commercial-v2-cp6-repair"
          test "${VERCEL_PROJECT_ID}" = "prj_iKtw9xKmIlEfe44gEocgLr2QDLfE"
          test "${VERCEL_PROJECT_NAME}" = "quickiching-staging"
          test "${VERCEL_TEAM_ID}" = "team_z1b9TTQtbNkr43dzs5JVJPnQ"
          test "${GITHUB_REPO_ID}" = "1317018295"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install PostgreSQL tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Re-run deterministic CP6 gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/codex/commercial-v2-cp6...HEAD
          node scripts/check-migration-integrity.mjs
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx drizzle-kit check
          node scripts/test-postgres-serial.mjs

      - name: Record current staging Production baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v13/deployments/staging.quickiching.com?teamId=${VERCEL_TEAM_ID}")"
          baseline_id="$(jq -r '.id // empty' <<<"$response")"
          baseline_state="$(jq -r '.readyState // .state // empty' <<<"$response")"
          baseline_target="$(jq -r '.target // empty' <<<"$response")"
          test -n "$baseline_id"
          test "$baseline_state" = "READY"
          test "$baseline_target" = "production"
          echo "baseline_id=${baseline_id}" >> "$GITHUB_OUTPUT"

      - name: Refuse pre-existing temporary migration credentials
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env")"
          for key in CP6_STAGING_APPLY_PENDING_MIGRATIONS CP6_STAGING_MAINTENANCE_TOKEN; do
            if jq -e --arg key "$key" '.envs[]? | select(.key == $key and ((.target == "production") or ((.target | type) == "array" and (.target | index("production") != null))))' >/dev/null <<<"$response"; then
              echo "::error::${key} already exists; refusing to overwrite it."
              exit 1
            fi
          done

      - name: Create one-time migration marker and maintenance token
        id: temporary_env
        shell: bash
        run: |
          set -euo pipefail
          maintenance_token="$(openssl rand -hex 32)"
          echo "::add-mask::${maintenance_token}"
          payload="$(jq -n --arg sha "$GITHUB_SHA" --arg token "$maintenance_token" '[
            {
              key: "CP6_STAGING_APPLY_PENDING_MIGRATIONS",
              value: $sha,
              type: "encrypted",
              target: ["production"],
              comment: "One-time exact-SHA CP6 staging migration marker; auto-removed"
            },
            {
              key: "CP6_STAGING_MAINTENANCE_TOKEN",
              value: $token,
              type: "sensitive",
              target: ["production"],
              comment: "Temporary CP6 staging migration diagnostics token; auto-removed"
            }
          ]')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" >/dev/null

          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env")"
          marker_id="$(jq -r '.envs[]? | select(.key == "CP6_STAGING_APPLY_PENDING_MIGRATIONS") | .id' <<<"$response" | head -n1)"
          token_id="$(jq -r '.envs[]? | select(.key == "CP6_STAGING_MAINTENANCE_TOKEN") | .id' <<<"$response" | head -n1)"
          test -n "$marker_id" && test "$marker_id" != "null"
          test -n "$token_id" && test "$token_id" != "null"
          echo "marker_id=${marker_id}" >> "$GITHUB_OUTPUT"
          echo "token_id=${token_id}" >> "$GITHUB_OUTPUT"
          echo "maintenance_token=${maintenance_token}" >> "$GITHUB_OUTPUT"

      - name: Create exact-SHA migration staging Production deployment
        id: migration_deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --argjson repoId "$GITHUB_REPO_ID" \
            '{
              name: $name,
              project: $project,
              target: "production",
              gitSource: { type: "github", repoId: $repoId, ref: $ref, sha: $sha },
              gitMetadata: {
                commitRef: $ref,
                commitSha: $sha,
                commitMessage: "CP6 controlled staging migration",
                ci: true,
                ciType: "github-actions"
              }
            }')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v13/deployments?forceNew=1")"
          deployment_id="$(jq -r '.id // empty' <<<"$response")"
          test -n "$deployment_id"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for migration deployment readiness
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="${{ steps.migration_deploy.outputs.deployment_id }}"
          for attempt in $(seq 1 180); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Accept: application/json" \
              "https://api.vercel.com/v13/deployments/${deployment_id}?withGitRepoInfo=true&teamId=${VERCEL_TEAM_ID}")"
            state="$(jq -r '.readyState // .status // empty' <<<"$response")"
            actual_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' <<<"$response")"
            test -z "$actual_sha" || test "$actual_sha" = "$GITHUB_SHA"
            case "$state" in
              READY) exit 0 ;;
              ERROR|CANCELED) echo "::error::Migration deployment entered ${state}"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for migration deployment"
          exit 1

      - name: Verify migrated staging runtime
        id: diagnostics
        shell: bash
        env:
          MAINTENANCE_TOKEN: ${{ steps.temporary_env.outputs.maintenance_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${MAINTENANCE_TOKEN}"
          diagnostics_file="$RUNNER_TEMP/cp6-staging-migration-diagnostics.json"
          success=false
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output "$diagnostics_file" --write-out "%{http_code}" \
              -H "Authorization: Bearer ${MAINTENANCE_TOKEN}" \
              "${STAGING_ORIGIN}/api/internal/cp6-staging-diagnostics")"
            if [ "$status" = "200" ]; then success=true; break; fi
            if [ "$status" != "404" ] && [ "$status" != "401" ] && [ "$status" != "502" ] && [ "$status" != "503" ]; then
              echo "::error::Unexpected diagnostics HTTP status ${status}"
              cat "$diagnostics_file"
              exit 1
            fi
            sleep 5
          done
          [ "$success" = true ]
          jq . "$diagnostics_file"
          test "$(jq -r '.deployment.gitSha // empty' "$diagnostics_file")" = "$GITHUB_SHA"
          test "$(jq -r '.deployment.environment // empty' "$diagnostics_file")" = "production"
          test "$(jq -r '.deployment.projectIdMatchesStaging // false' "$diagnostics_file")" = "true"
          test "$(jq -r '.deployment.productionUrlMatchesStaging // false' "$diagnostics_file")" = "true"
          test "$(jq -r '.database.connected // false' "$diagnostics_file")" = "true"
          test "$(jq -r '.database.migrationTablePresent // false' "$diagnostics_file")" = "true"
          test "$(jq -r '.database.migrationStatus // empty' "$diagnostics_file")" = "ok"
          test "$(jq -r '.database.appliedMigrationCount // 0' "$diagnostics_file")" = "11"
          test "$(jq -r '.database.expectedMigrationCount // 0' "$diagnostics_file")" = "11"
          test "$(jq -r '.database.classification // empty' "$diagnostics_file")" = "ready"
          test "$(jq -r '.database.missingTables | length' "$diagnostics_file")" = "0"
          test "$(jq -r '.provider.waffoEnvironmentIsTest // false' "$diagnostics_file")" = "true"
          cp "$diagnostics_file" cp6-staging-migration-diagnostics.json

      - name: Upload non-sensitive migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp6-staging-migration-${{ github.sha }}
          path: cp6-staging-migration-diagnostics.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Vercel environment variables
        if: always() && steps.temporary_env.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          for id in "${{ steps.temporary_env.outputs.marker_id }}" "${{ steps.temporary_env.outputs.token_id }}"; do
            if [ -n "$id" ]; then
              http="$(curl --silent --show-error \
                --output "$RUNNER_TEMP/env-delete.json" \
                --write-out "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_TEAM_ID}")"
              test "$http" = "200" || test "$http" = "404"
            fi
          done

      - name: Prove temporary environment variables are absent
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env")"
          for key in CP6_STAGING_APPLY_PENDING_MIGRATIONS CP6_STAGING_MAINTENANCE_TOKEN; do
            if jq -e --arg key "$key" '.envs[]? | select(.key == $key and ((.target == "production") or ((.target | type) == "array" and (.target | index("production") != null))))' >/dev/null <<<"$response"; then
              echo "::error::${key} still exists after cleanup"
              exit 1
            fi
          done

      - name: Create clean exact-SHA staging Production deployment
        id: clean_deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --argjson repoId "$GITHUB_REPO_ID" \
            '{
              name: $name,
              project: $project,
              target: "production",
              gitSource: { type: "github", repoId: $repoId, ref: $ref, sha: $sha },
              gitMetadata: {
                commitRef: $ref,
                commitSha: $sha,
                commitMessage: "CP6 clean staging deployment after migration",
                ci: true,
                ciType: "github-actions"
              }
            }')"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v13/deployments?forceNew=1")"
          deployment_id="$(jq -r '.id // empty' <<<"$response")"
          test -n "$deployment_id"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for clean deployment readiness
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="${{ steps.clean_deploy.outputs.deployment_id }}"
          for attempt in $(seq 1 180); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Accept: application/json" \
              "https://api.vercel.com/v13/deployments/${deployment_id}?withGitRepoInfo=true&teamId=${VERCEL_TEAM_ID}")"
            state="$(jq -r '.readyState // .status // empty' <<<"$response")"
            actual_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' <<<"$response")"
            test -z "$actual_sha" || test "$actual_sha" = "$GITHUB_SHA"
            case "$state" in
              READY) exit 0 ;;
              ERROR|CANCELED) echo "::error::Clean deployment entered ${state}"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for clean deployment"
          exit 1

      - name: Verify clean deployment is serving staging
        shell: bash
        run: |
          set -euo pipefail
          expected_id="${{ steps.clean_deploy.outputs.deployment_id }}"
          for attempt in $(seq 1 30); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Accept: application/json" \
              "https://api.vercel.com/v13/deployments/staging.quickiching.com?teamId=${VERCEL_TEAM_ID}")"
            current_id="$(jq -r '.id // empty' <<<"$response")"
            current_state="$(jq -r '.readyState // .state // empty' <<<"$response")"
            if [ "$current_id" = "$expected_id" ] && [ "$current_state" = "READY" ]; then break; fi
            sleep 5
          done
          test "$current_id" = "$expected_id"
          test "$current_state" = "READY"

          health_status="$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out "%{http_code}" "${STAGING_ORIGIN}/api/health")"
          ready_status="$(curl --silent --show-error --output "$RUNNER_TEMP/ready.json" --write-out "%{http_code}" "${STAGING_ORIGIN}/api/ready")"
          test "$health_status" = "200"
          test "$ready_status" = "503"

          diagnostics_status="$(curl --silent --show-error --output "$RUNNER_TEMP/diagnostics-after-clean.txt" --write-out "%{http_code}" \
            -H "Authorization: Bearer invalid-after-clean" \
            "${STAGING_ORIGIN}/api/internal/cp6-staging-diagnostics")"
          test "$diagnostics_status" = "404"

      - name: Delete temporary migration deployment
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="${{ steps.migration_deploy.outputs.deployment_id }}"
          clean_id="${{ steps.clean_deploy.outputs.deployment_id }}"
          test -n "$deployment_id"
          test -n "$clean_id"
          test "$deployment_id" != "$clean_id"
          http="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/migration-deploy-delete.json" \
            --write-out "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_TEAM_ID}")"
          test "$http" = "200" || test "$http" = "404"
