name: Payment Closeout Dependency Trial

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths: [.github/workflows/payment-closeout-dependency-trial.yml]

permissions:
  contents: read

jobs:
  trial:
    name: Trial compatible security patches without committing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Trial direct security patch upgrades
        run: bun update next@15.5.25 eslint-config-next@15.5.25 postcss@8.5.28
      - name: Trial safe transitive security overrides
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            postcss: '8.5.28',
            sharp: '0.35.4',
            undici: '7.29.1',
            nanoid: '5.1.16',
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          bun install
      - name: Refresh brace-expansion maintenance-line lock resolutions only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'bun.lock';
          let text = fs.readFileSync(file, 'utf8');
          const replacements = [
            {
              from: '["brace-expansion@1.1.17", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-1.1.17.tgz", { "dependencies": { "balanced-match": "^1.0.0", "concat-map": "0.0.1" } }, "sha512-w+aeW/mkgM4PyRMOJCgi3fOrTm5Q8QY1OSfn2TO2iuDj3ezIHqejmuxbjfPrqUkgqRew1iqkyAn0tr0ZwHD9+w=="]',
              to: '["brace-expansion@1.1.18", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-1.1.18.tgz", { "dependencies": { "balanced-match": "^1.0.0", "concat-map": "0.0.1" } }, "sha512-Edep/X9fGqVNmzKBVsDYIOtD+z1tuezV70LBjdCst9Tqu76lsnvRiZ6oTic1n+/BIwX6QDGAO94PN4N2SADvtw=="]',
              label: '1.1.17'
            },
            {
              from: '["brace-expansion@2.1.3", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-2.1.3.tgz", { "dependencies": { "balanced-match": "^1.0.0" } }, "sha512-DRdx5neNsG/QXbniLFWi2YmC/68oeOOmKz6zOjVk6ZS1ZLXgLIKqVEc6hWsmkjBbgii0SwaBTcJ5XKj5gzY/4A=="]',
              to: '["brace-expansion@2.1.4", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-2.1.4.tgz", { "dependencies": { "balanced-match": "^1.0.0" } }, "sha512-hGfVzPxthbf3+2yjg/RBs60cB0FhqBS/zvdV/4wn4/BmN0bNMMHPc4V/BbFieqf1TKAGGAHnY4eSjajCl0f2Xg=="]',
              label: '2.1.3'
            },
            {
              from: '["brace-expansion@5.0.8", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-5.0.8.tgz", { "dependencies": { "balanced-match": "^4.0.2" } }, "sha512-JZyDyq3D4AUifKTPOB7DELf6XsB3WdPuNxCtob1vFXPsSXhdAiHBWJ/tJ8HAc9aH84BK+5JFZLNkJKx3G9kzQg=="]',
              to: '["brace-expansion@5.0.9", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-5.0.9.tgz", { "dependencies": { "balanced-match": "^4.0.2" } }, "sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg=="]',
              label: '5.0.8'
            }
          ];
          for (const r of replacements) {
            const count = text.split(r.from).length - 1;
            if (count < 1) throw new Error(`Expected at least one stale brace-expansion ${r.label} record`);
            console.log(`Refreshing ${count} brace-expansion ${r.label} lock record(s)`);
            text = text.split(r.from).join(r.to);
          }
          for (const stale of ['brace-expansion@1.1.17','brace-expansion@2.1.3','brace-expansion@5.0.8']) {
            if (text.includes(stale)) throw new Error(`Stale ${stale} remains in lockfile`);
          }
          fs.writeFileSync(file, text);
          NODE
          rm -rf node_modules
          bun install --frozen-lockfile
      - name: Prove installed brace-expansion copies are on patched maintenance lines
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const found = [];
          function walk(dir) {
            let entries;
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return; }
            for (const e of entries) {
              const p = path.join(dir, e.name);
              if (!e.isDirectory()) continue;
              if (e.name === 'brace-expansion') {
                const pkgPath = path.join(p, 'package.json');
                try { found.push({ version: JSON.parse(fs.readFileSync(pkgPath, 'utf8')).version, path: pkgPath }); } catch {}
              }
              if (e.name !== '.cache') walk(p);
            }
          }
          walk('node_modules');
          const uniq = [...new Set(found.map(x => x.version))].sort();
          console.log('Installed brace-expansion versions:', uniq.join(', '));
          const vulnerable = found.filter(({version}) => {
            const [maj,min,pat] = version.split('.').map(Number);
            if (maj === 1) return min < 1 || (min === 1 && pat < 18);
            if (maj === 2) return min < 1 || (min === 1 && pat < 4);
            if (maj === 3) return min < 0 || (min === 0 && pat < 6);
            if (maj === 4) return true;
            if (maj === 5) return min === 0 && pat < 9;
            return false;
          });
          if (vulnerable.length) {
            console.error(vulnerable.map(x => `${x.version}:${x.path}`).join('\n'));
            process.exit(1);
          }
          NODE
      - name: Require zero high or critical advisories
        run: bun audit --audit-level=high
      - name: Verify full deterministic application gates after trial
        run: |
          node scripts/check-migration-integrity.mjs
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx drizzle-kit check
