name: Payment Closeout Dependency Trial

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths: [.github/workflows/payment-closeout-dependency-trial.yml]

permissions:
  contents: read

jobs:
  trial:
    name: Trial compatible security patches without committing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Trial direct security patch upgrades
        run: |
          bun update next@15.5.25 eslint-config-next@15.5.25 postcss@8.5.28
          bun add --dev brace-expansion@5.0.9
      - name: Trial safe transitive security overrides
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            postcss: '8.5.28',
            sharp: '0.35.4',
            undici: '7.29.1',
            nanoid: '5.1.16',
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          bun install
      - name: Require zero high or critical advisories
        run: |
          bun audit --audit-level=high
          bun why brace-expansion
      - name: Verify full deterministic application gates after trial
        run: |
          node scripts/check-migration-integrity.mjs
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx drizzle-kit check
