name: Payment Closeout Dependency Trial

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths: [.github/workflows/payment-closeout-dependency-trial.yml]

permissions:
  contents: read

jobs:
  trial:
    name: Trial compatible security patches without committing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Trial direct security patch upgrades
        run: bun update next@15.5.25 eslint-config-next@15.5.25 postcss@8.5.28
      - name: Trial safe transitive security overrides
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            postcss: '8.5.28',
            sharp: '0.35.4',
            undici: '7.29.1',
            nanoid: '5.1.16',
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          bun install
      - name: Refresh only stale brace-expansion 5.0.8 lock resolutions to 5.0.9
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'bun.lock';
          let text = fs.readFileSync(file, 'utf8');
          const oldRecord = '["brace-expansion@5.0.8", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-5.0.8.tgz", { "dependencies": { "balanced-match": "^4.0.2" } }, "sha512-JZyDyq3D4AUifKTPOB7DELf6XsB3WdPuNxCtob1vFXPsSXhdAiHBWJ/tJ8HAc9aH84BK+5JFZLNkJKx3G9kzQg=="]';
          const newRecord = '["brace-expansion@5.0.9", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-5.0.9.tgz", { "dependencies": { "balanced-match": "^4.0.2" } }, "sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg=="]';
          const matches = text.split(oldRecord).length - 1;
          if (matches !== 5) throw new Error(`Expected exactly 5 stale brace-expansion records, found ${matches}`);
          text = text.split(oldRecord).join(newRecord);
          if (text.includes('brace-expansion@5.0.8')) throw new Error('Stale brace-expansion 5.0.8 remains in lockfile');
          fs.writeFileSync(file, text);
          NODE
          rm -rf node_modules
          bun install --frozen-lockfile
      - name: Prove no vulnerable brace-expansion 4.x or 5.0.0-5.0.8 is installed
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const found = [];
          function walk(dir) {
            let entries;
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return; }
            for (const e of entries) {
              const p = path.join(dir, e.name);
              if (!e.isDirectory()) continue;
              if (e.name === 'brace-expansion') {
                const pkgPath = path.join(p, 'package.json');
                try {
                  const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                  found.push({ version: pkg.version, path: pkgPath });
                } catch {}
              }
              if (e.name !== '.cache') walk(p);
            }
          }
          walk('node_modules');
          const uniq = [...new Set(found.map(x => x.version))].sort();
          console.log('Installed brace-expansion versions:', uniq.join(', '));
          const vulnerable = found.filter(({version}) => {
            const [maj,min,pat] = version.split('.').map(Number);
            return maj >= 4 && (maj < 5 || (maj === 5 && min === 0 && pat < 9));
          });
          if (vulnerable.length) {
            console.error(vulnerable.map(x => `${x.version}:${x.path}`).join('\n'));
            process.exit(1);
          }
          NODE
      - name: Require zero high or critical advisories
        run: bun audit --audit-level=high
      - name: Verify full deterministic application gates after trial
        run: |
          node scripts/check-migration-integrity.mjs
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx drizzle-kit check
