name: Payment Closeout Dependency Trial

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths: [.github/workflows/payment-closeout-dependency-trial.yml]

permissions:
  contents: read

jobs:
  trial:
    name: Trial compatible security patches without committing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Trial patch-level direct dependency upgrades
        run: bun update next@15.5.25 eslint-config-next@15.5.25 postcss@8.5.28
      - name: Trial safe transitive security overrides excluding brace-expansion
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            postcss: '8.5.28',
            sharp: '0.35.4',
            undici: '7.29.1',
            nanoid: '5.1.16',
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          bun install
      - name: Record remaining audit findings and brace dependency parents
        run: |
          set +e
          bun audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/audit.txt"
          audit_status=${PIPESTATUS[0]}
          set -e
          echo "audit_status=${audit_status}"
          bun why brace-expansion || true
          python - <<'PY'
          from pathlib import Path
          text = Path(__import__('os').environ['RUNNER_TEMP'] + '/audit.txt').read_text()
          known = 'brace-expansion' in text and 'GHSA-rgw5-rvv9-x895' in text
          other = [name for name in ['postcss','sharp','undici','nanoid','js-yaml','next'] if name in text]
          if not known or other:
              raise SystemExit('Unexpected remaining high advisory set: ' + ','.join(other))
          print('Only the known brace-expansion high advisory remains after safe trial patches.')
          PY
      - name: Verify safe trial preserves lint typecheck tests and production build
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx drizzle-kit check
