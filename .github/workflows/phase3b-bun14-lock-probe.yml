name: Phase 3B C4 Final Bun 1.3.14 Validation

on:
  pull_request:
    branches: [fix/phase3-security-runtime-hardening]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/phase3-engineering-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify migration is registry-only and graph-zero-drift
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.14"
          git show HEAD^:bun.lock > /tmp/c4-before.lock
          node <<'NODE'
          const fs=require("fs"), vm=require("vm"), crypto=require("crypto");
          const beforeText=fs.readFileSync("/tmp/c4-before.lock","utf8");
          const afterText=fs.readFileSync("bun.lock","utf8");
          const parse=t=>vm.runInNewContext("("+t+")",Object.create(null),{timeout:3000});
          const before=parse(beforeText), after=parse(afterText);
          const bp=before.packages||{}, ap=after.packages||{};
          const keysB=Object.keys(bp).sort(), keysA=Object.keys(ap).sort();
          if(JSON.stringify(keysB)!==JSON.stringify(keysA)) throw new Error("package key drift");
          if(JSON.stringify(before.workspaces||{})!==JSON.stringify(after.workspaces||{})) throw new Error("workspace drift");
          if(JSON.stringify(before.overrides||{})!==JSON.stringify(after.overrides||{})) throw new Error("override drift");
          if(JSON.stringify(before.patchedDependencies||{})!==JSON.stringify(after.patchedDependencies||{})) throw new Error("patch drift");

          let registryOnlyChanges=0;
          for(const k of keysB){
            const b=bp[k], a=ap[k];
            if(!Array.isArray(b) || !Array.isArray(a)){
              if(JSON.stringify(b)!==JSON.stringify(a)) throw new Error("non-array package drift "+k);
              continue;
            }
            const bc=structuredClone(b), ac=structuredClone(a);
            const isMirror=typeof bc[1]==="string" && bc[1].startsWith("https://registry.npmmirror.com/");
            if(isMirror){
              if(ac[1]!=="") throw new Error("canonical registry not elided for "+k);
              registryOnlyChanges++;
              bc[1]="";
            }
            if(JSON.stringify(bc)!==JSON.stringify(ac)) throw new Error("semantic package drift "+k);
          }

          const mirrorBefore=(beforeText.match(/registry\.npmmirror\.com/g)||[]).length;
          const mirrorAfter=(afterText.match(/registry\.npmmirror\.com/g)||[]).length;
          const npmBefore=(beforeText.match(/registry\.npmjs\.org/g)||[]).length;
          const npmAfter=(afterText.match(/registry\.npmjs\.org/g)||[]).length;
          if(mirrorBefore!==1154 || mirrorAfter!==0 || npmBefore!==0 || npmAfter!==0) {
            throw new Error("registry count mismatch "+JSON.stringify({mirrorBefore,mirrorAfter,npmBefore,npmAfter}));
          }
          if(registryOnlyChanges!==1154) throw new Error("expected 1154 registry-only changes, got "+registryOnlyChanges);

          const hosts={};
          for(const m of afterText.matchAll(/https?:\/\/[^"'\s\],}]+/g)){
            try{const h=new URL(m[0]).hostname;hosts[h]=(hosts[h]||0)+1}catch{}
          }

          const digest=v=>crypto.createHash("sha256").update(JSON.stringify(v)).digest("hex");
          console.log(JSON.stringify({
            packageCount:keysB.length,
            registryOnlyChanges,
            packageIdentity:"PASS",
            packageVersions:"PASS",
            dependencyEdges:"PASS",
            peerResolutions:"PASS",
            optionalResolutions:"PASS",
            integrityHashes:"PASS",
            patchReferences:"PASS",
            workspaces:"PASS",
            startingNpmmirror:mirrorBefore,
            finalNpmmirror:mirrorAfter,
            startingNpmjs:npmBefore,
            finalNpmjs:npmAfter,
            remainingUrlHosts:hosts,
            beforePackagesDigest:digest(bp),
            afterPackagesDigestAfterRegistryNormalization:digest(Object.fromEntries(keysA.map(k=>{
              const x=structuredClone(ap[k]);
              if(Array.isArray(x) && x[1]==="" && typeof x[0]==="string" && typeof x[x.length-1]==="string" && /^sha/.test(x[x.length-1])){
                const old=bp[k];
                if(Array.isArray(old) && typeof old[1]==="string" && old[1].startsWith("https://registry.npmmirror.com/")) x[1]=old[1];
              }
              return [k,x];
            })))
          }));
          NODE
          test "$(cat bunfig.toml)" = $'[install]\nregistry = "https://registry.npmjs.org/"'

      - name: Fresh Bun 1.3.14 frozen install does not rewrite lock
        run: |
          set -euo pipefail
          rm -rf node_modules "$RUNNER_TEMP/c4-home-frozen" "$RUNNER_TEMP/c4-cache-frozen"
          mkdir -p "$RUNNER_TEMP/c4-home-frozen" "$RUNNER_TEMP/c4-cache-frozen"
          cp bun.lock /tmp/c4-committed.lock
          HOME="$RUNNER_TEMP/c4-home-frozen" BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/c4-cache-frozen" bun install --frozen-lockfile
          cmp -s bun.lock /tmp/c4-committed.lock
          bun pm ls --all | sort > /tmp/c4-tree-frozen.txt
          echo "frozen-install-lock-rewrite=NO"

      - name: Bun 1.3.14 lock regeneration is byte-stable twice
        run: |
          set -euo pipefail
          for n in 1 2; do
            rm -rf node_modules "$RUNNER_TEMP/c4-home-regen-$n" "$RUNNER_TEMP/c4-cache-regen-$n"
            mkdir -p "$RUNNER_TEMP/c4-home-regen-$n" "$RUNNER_TEMP/c4-cache-regen-$n"
            HOME="$RUNNER_TEMP/c4-home-regen-$n" BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/c4-cache-regen-$n" bun install --lockfile-only
            if ! cmp -s bun.lock /tmp/c4-committed.lock; then
              echo "regeneration-$n-rewrote-lock=YES"
              git diff -- bun.lock | head -n 500
              exit 1
            fi
            echo "regeneration-$n-rewrote-lock=NO"
          done

      - name: Final fresh frozen install and dependency audit
        run: |
          set -euo pipefail
          rm -rf node_modules "$RUNNER_TEMP/c4-home-final" "$RUNNER_TEMP/c4-cache-final"
          mkdir -p "$RUNNER_TEMP/c4-home-final" "$RUNNER_TEMP/c4-cache-final"
          HOME="$RUNNER_TEMP/c4-home-final" BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/c4-cache-final" bun install --frozen-lockfile
          cmp -s bun.lock /tmp/c4-committed.lock
          bun pm ls --all | sort > /tmp/c4-tree-final.txt
          diff -u /tmp/c4-tree-frozen.txt /tmp/c4-tree-final.txt
          set +e
          bun audit --json > /tmp/c4-audit.json 2>/tmp/c4-audit.err
          audit_code=$?
          set -e
          echo "bun-audit-exit=$audit_code"
          echo "bun-audit-json-bytes=$(wc -c < /tmp/c4-audit.json)"
          echo "bun-audit-stderr-bytes=$(wc -c < /tmp/c4-audit.err)"
          if [ -s /tmp/c4-audit.json ]; then
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/c4-audit.json","utf8")); console.log(JSON.stringify(x.metadata||x.summary||{}))' || true
          fi
