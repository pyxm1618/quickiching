name: Payment Closeout Staging Preflight

on:
  push:
    branches:
      - fix/waffo-payment-closeout
    paths:
      - .github/workflows/payment-closeout-staging-preflight.yml
      - scripts/payment-closeout-staging-env-audit.ts
      - src/server/readiness/payment-closeout-env-audit.ts
      - src/server/readiness/payment-closeout-env-audit.test.ts
      - src/server/payments/waffo-adapter.ts
      - src/server/capabilities.ts
      - drizzle/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-closeout-staging-preflight
  cancel-in-progress: true

jobs:
  preflight:
    name: Read-only staging payment environment preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_iKtw9xKmIlEfe44gEocgLr2QDLfE
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run closeout environment contract tests
        run: bunx vitest run src/server/readiness/payment-closeout-env-audit.test.ts src/server/payments/environment-contract.test.ts
      - name: Require authenticated staging-only Vercel access
        run: |
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_iKtw9xKmIlEfe44gEocgLr2QDLfE" || { echo "::error::Unexpected Vercel project binding"; exit 1; }
      - name: Audit staging payment environment metadata without exposing values
        run: bun scripts/payment-closeout-staging-env-audit.ts
