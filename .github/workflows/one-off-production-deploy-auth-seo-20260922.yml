name: One-off Production Deploy — Auth + SEO

on:
  push:
    branches:
      - ops/deploy-auth-seo-20260922

permissions:
  contents: read

concurrency:
  group: one-off-production-deploy-auth-seo-20260922
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_z1b9TTQtbNkr43dzs5JVJPnQ
  VERCEL_PROJECT_ID: prj_pCpeoAys2GOqKZvkbLugYjpJWZBS
  RELEASE_SHA: 4ff71abfd6abe3dbfc3866aacc8d33ae8cac7170
  RELEASE_TREE: 678ee6134e3501b4052bea84823a330c46536a15

jobs:
  deploy:
    name: Create exact Git production deployment via Vercel REST API
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify deploy credential exists
        run: test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }

      - name: Checkout exact merged release identity
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify release tree
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"

      - name: Verify Vercel production project access
        run: |
          code="$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}"             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Vercel project access failed with HTTP $code"
            cat /tmp/vercel-project.json
            exit 1
          fi
          test "$(jq -r '.id' /tmp/vercel-project.json)" = "$VERCEL_PROJECT_ID"

      - name: Create production deployment from exact Git commit
        id: create
        run: |
          jq -n             --arg sha "$RELEASE_SHA"             '{
              name: "ichingcoin",
              project: "prj_pCpeoAys2GOqKZvkbLugYjpJWZBS",
              target: "production",
              gitSource: {
                type: "github",
                org: "pyxm1618",
                repo: "quickiching",
                ref: "fix/waffo-payment-closeout",
                sha: $sha
              },
              gitMetadata: {
                remoteUrl: "https://github.com/pyxm1618/quickiching",
                commitRef: "fix/waffo-payment-closeout",
                commitSha: $sha,
                commitMessage: "Merge PR #42: authentication closeout and homepage SEO",
                ci: true,
                ciType: "github-actions"
              },
              projectSettings: {
                commandForIgnoringBuildStep: ""
              }
            }' > /tmp/vercel-deploy-payload.json

          code="$(curl -sS -o /tmp/vercel-deploy.json -w "%{http_code}"             -X POST             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/vercel-deploy-payload.json             "https://api.vercel.com/v13/deployments?forceNew=1&skipAutoDetectionConfirmation=1&teamId=$VERCEL_ORG_ID")"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Create production deployment failed with HTTP $code"
            cat /tmp/vercel-deploy.json
            exit 1
          fi

          id="$(jq -r '.id' /tmp/vercel-deploy.json)"
          url="$(jq -r '.url' /tmp/vercel-deploy.json)"
          test -n "$id" && test "$id" != "null"
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Created production deployment: $id ($url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for production deployment
        env:
          DEPLOYMENT_ID: ${{ steps.create.outputs.deployment_id }}
        run: |
          for attempt in $(seq 1 120); do
            code="$(curl -sS -o /tmp/vercel-status.json -w "%{http_code}"               -H "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Deployment status lookup failed with HTTP $code"
              cat /tmp/vercel-status.json
              exit 1
            fi
            state="$(jq -r '.readyState // .status // empty' /tmp/vercel-status.json)"
            echo "Deployment state: $state"
            case "$state" in
              READY)
                echo "Production deployment READY: $DEPLOYMENT_ID" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              ERROR|CANCELED)
                echo "::error::Production deployment ended in $state"
                jq '{id,url,readyState,status,errorCode,errorMessage}' /tmp/vercel-status.json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Production deployment did not reach a terminal state within the workflow window"
          exit 1

      - name: Record release identity
        run: |
          echo "Release commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tree: $RELEASE_TREE" >> "$GITHUB_STEP_SUMMARY"
