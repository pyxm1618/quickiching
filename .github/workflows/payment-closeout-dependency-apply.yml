name: Payment Closeout Dependency Apply

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths: [.github/workflows/payment-closeout-dependency-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    name: Apply previously verified dependency security patches
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/waffo-payment-closeout
      - name: Lock write scope
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/waffo-payment-closeout"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply direct security patch upgrades
        run: bun update next@15.5.25 eslint-config-next@15.5.25 postcss@8.5.28
      - name: Apply verified transitive security overrides
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            postcss: '8.5.28',
            sharp: '0.35.4',
            undici: '7.29.1',
            nanoid: '5.1.16',
            'js-yaml': '4.3.2'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          bun install
      - name: Refresh brace-expansion maintenance-line lock resolutions only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let text = fs.readFileSync('bun.lock', 'utf8');
          const replacements = [
            ['["brace-expansion@1.1.17", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-1.1.17.tgz", { "dependencies": { "balanced-match": "^1.0.0", "concat-map": "0.0.1" } }, "sha512-w+aeW/mkgM4PyRMOJCgi3fOrTm5Q8QY1OSfn2TO2iuDj3ezIHqejmuxbjfPrqUkgqRew1iqkyAn0tr0ZwHD9+w=="]','["brace-expansion@1.1.18", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-1.1.18.tgz", { "dependencies": { "balanced-match": "^1.0.0", "concat-map": "0.0.1" } }, "sha512-Edep/X9fGqVNmzKBVsDYIOtD+z1tuezV70LBjdCst9Tqu76lsnvRiZ6oTic1n+/BIwX6QDGAO94PN4N2SADvtw=="]','1.1.17'],
            ['["brace-expansion@2.1.3", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-2.1.3.tgz", { "dependencies": { "balanced-match": "^1.0.0" } }, "sha512-DRdx5neNsG/QXbniLFWi2YmC/68oeOOmKz6zOjVk6ZS1ZLXgLIKqVEc6hWsmkjBbgii0SwaBTcJ5XKj5gzY/4A=="]','["brace-expansion@2.1.4", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-2.1.4.tgz", { "dependencies": { "balanced-match": "^1.0.0" } }, "sha512-hGfVzPxthbf3+2yjg/RBs60cB0FhqBS/zvdV/4wn4/BmN0bNMMHPc4V/BbFieqf1TKAGGAHnY4eSjajCl0f2Xg=="]','2.1.3'],
            ['["brace-expansion@5.0.8", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-5.0.8.tgz", { "dependencies": { "balanced-match": "^4.0.2" } }, "sha512-JZyDyq3D4AUifKTPOB7DELf6XsB3WdPuNxCtob1vFXPsSXhdAiHBWJ/tJ8HAc9aH84BK+5JFZLNkJKx3G9kzQg=="]','["brace-expansion@5.0.9", "https://registry.npmmirror.com/brace-expansion/-/brace-expansion-5.0.9.tgz", { "dependencies": { "balanced-match": "^4.0.2" } }, "sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg=="]','5.0.8']
          ];
          for (const [from,to,label] of replacements) {
            const count = text.split(from).length - 1;
            if (count < 1) throw new Error(`Expected stale brace-expansion ${label} record`);
            text = text.split(from).join(to);
          }
          for (const stale of ['brace-expansion@1.1.17','brace-expansion@2.1.3','brace-expansion@5.0.8']) {
            if (text.includes(stale)) throw new Error(`Stale ${stale} remains`);
          }
          fs.writeFileSync('bun.lock', text);
          NODE
          rm -rf node_modules
          bun install --frozen-lockfile
      - name: Require zero high or critical advisories
        run: bun audit --audit-level=high
      - name: Verify deterministic application gates before committing
        run: |
          node scripts/check-migration-integrity.mjs
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx drizzle-kit check
      - name: Enforce exact write scope and commit
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' bun.lock package.json | sort)"
          test "$changed" = "$expected" || { echo "::error::Unexpected dependency apply diff"; printf '%s\n' "$changed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "fix(security): patch payment closeout dependency advisories"
          git push origin HEAD:fix/waffo-payment-closeout
