name: Production Schema Readiness & Drizzle Release

on:
  workflow_dispatch:
    inputs:
      schema_action:
        description: Inspect production schema, or apply the exact next Drizzle migration after a complete preflight
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - migrate

permissions:
  contents: read

concurrency:
  group: payment-closeout-production-env-audit
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_pCpeoAys2GOqKZvkbLugYjpJWZBS
  VERCEL_TEAM_ID: team_z1b9TTQtbNkr43dzs5JVJPnQ

jobs:
  audit:
    name: Production schema readiness and Drizzle release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Lock read-only production scope
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 1; }
          test -n "${PRODUCTION_DATABASE_URL:-}" || { echo "::error::PRODUCTION_DATABASE_URL is not configured in GitHub Actions secrets"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_pCpeoAys2GOqKZvkbLugYjpJWZBS"
          test "$VERCEL_TEAM_ID" = "team_z1b9TTQtbNkr43dzs5JVJPnQ"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify audit contract
        run: bunx vitest run src/server/readiness/payment-closeout-env-audit.test.ts src/server/payments/environment-contract.test.ts
      - name: Audit production payment env metadata without exposing values
        run: bun scripts/payment-closeout-production-env-audit.ts
      - name: Verify Drizzle journal and migration integrity manifest
        run: node scripts/check-migration-integrity.mjs
      - name: Inspect or apply migration 0012 through Drizzle
        env:
          PRODUCTION_SCHEMA_ACTION: ${{ inputs.schema_action }}
        run: bun scripts/production-schema-release.ts
      - name: Collect existing production acceptance evidence without database writes
        if: inputs.schema_action == 'inspect'
        run: bun scripts/production-closeout-evidence.ts
      - name: Inspect production request status and runtime errors
        if: inputs.schema_action == 'inspect'
        run: |
          bunx vercel logs --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN" --environment production --no-branch --no-follow --since 2026-09-28T14:00:00Z --query /api/readings --limit 50 --json > production-request-logs.jsonl
          bunx vercel logs --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN" --environment production --no-branch --no-follow --since 2026-09-28T14:00:00Z --level error --level fatal --limit 50 --json > production-error-logs.jsonl
          bun -e 'for (const path of ["production-request-logs.jsonl", "production-error-logs.jsonl"]) { const lines = (await Bun.file(path).text()).trim().split("\n").filter(Boolean); console.log(JSON.stringify({file:path,entries:lines.length,logs:lines.map(line => { const row=JSON.parse(line); return {timestamp:row.timestamp,level:row.level,statusCode:row.statusCode,requestPath:row.requestPath,path:row.path,method:row.method,deploymentId:row.deploymentId}; })})); }'
      - uses: actions/upload-artifact@v4
        if: inputs.schema_action == 'inspect' && success()
        with:
          name: production-closeout-evidence
          path: production-closeout-evidence.json
          retention-days: 7
