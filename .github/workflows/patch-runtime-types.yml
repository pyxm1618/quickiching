name: patch-runtime-types

on:
  push:
    branches:
      - agent/v2-1-jobs-release
    paths:
      - .github/workflows/patch-runtime-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-jobs-release
      - name: Apply exact transaction type patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/server/runtime/postgres-application.ts')
          text = path.read_text()
          replacements = {
            'private async markIrreversible(tx: Sql, casting: Record<string, unknown>, now: Date)':
              'private async markIrreversible(tx: any, casting: Record<string, any>, now: Date)',
            '    tx: Sql,\n    casting: Record<string, unknown>,\n    lineValues: LineValue[],':
              '    tx: any,\n    casting: Record<string, any>,\n    lineValues: LineValue[],',
            'private async readQuestion(tx: Sql, casting: Record<string, unknown>)':
              'private async readQuestion(tx: any, casting: Record<string, any>)',
          }
          for old, new in replacements.items():
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected one match, found {count}: {old!r}')
            text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-runtime-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/runtime/postgres-application.ts .github/workflows/patch-runtime-types.yml
          git commit -m "fix: accept PostgreSQL transaction clients in runtime helpers"
          git push origin HEAD:agent/v2-1-jobs-release
