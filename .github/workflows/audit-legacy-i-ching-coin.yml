name: Audit legacy I Ching Coin references

on:
  push:
    branches:
      - agent/rename-quick-i-ching
    paths:
      - .github/workflows/audit-legacy-i-ching-coin.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rename branch
        uses: actions/checkout@v4
        with:
          ref: agent/rename-quick-i-ching
          fetch-depth: 0

      - name: Verify legacy route and wording are gone
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          audit_file = Path('.github/workflows/audit-legacy-i-ching-coin.yml')
          legacy_route = Path('src/app/i-ching-coin/page.tsx')
          if legacy_route.exists():
              raise SystemExit(f'Legacy route still exists: {legacy_route}')

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          violations = []
          allowed_hyphenated_file = Path('src/lib/crypto/index.ts')

          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode('utf-8'))
              if path == audit_file or not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              folded = text.casefold()
              if 'i ching coin' in folded:
                  violations.append(f'{path}: contains old spaced name')
              if 'i-ching-coin' in folded and path != allowed_hyphenated_file:
                  violations.append(f'{path}: contains old hyphenated route/name')

          if violations:
              raise SystemExit('\n'.join(violations))

          crypto_text = allowed_hyphenated_file.read_text(encoding='utf-8')
          expected = 'STABLE_KEY_DERIVATION_NAMESPACE = "iching-coin"'
          if expected not in crypto_text:
              raise SystemExit('Expected cryptographic compatibility namespace is missing or changed')

          print('Audit passed: old route removed; code/docs contain no old brand or route references; only crypto namespace remains.')
          PY

      - name: Remove temporary audit workflow
        shell: bash
        run: |
          rm .github/workflows/audit-legacy-i-ching-coin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete legacy route removal audit"
          git push origin HEAD:agent/rename-quick-i-ching
