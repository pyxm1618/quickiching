name: Brand rename and audit

on:
  push:
    branches:
      - agent/rename-quick-i-ching
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace legacy brand identifiers and audit residuals
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import pathlib
          import re
          import subprocess

          replacements = {
              "I Ching Coin": "Quick I Ching",
              "ichingcoin.com": "quickiching.com",
              '"name": "iching-coin"': '"name": "quick-i-ching"',
              'service: "ichingcoin"': 'service: "quickiching"',
              "IChingCoinPage": "QuickIChingPage",
          }
          patterns = [
              r"I Ching Coin",
              r"i ching coin",
              r"ICHING COIN",
              r"I-Ching Coin",
              r"i-ching-coin",
              r"iching-coin",
              r"i_ching_coin",
              r"iching_coin",
              r"IChingCoin",
              r"iChingCoin",
              r"ICHINGCOIN",
              r"ichingcoin",
          ]
          combined = re.compile("|".join(f"(?:{pattern})" for pattern in patterns))
          excluded = {
              ".github/workflows/brand-audit.yml",
              "docs/brand-audit.txt",
          }

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed: list[str] = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode("utf-8"))
              normalized = path.as_posix()
              if normalized in excluded or not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  original = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(normalized)

          matches: list[str] = []
          tracked_after = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw_path in tracked_after:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode("utf-8"))
              normalized = path.as_posix()
              if normalized in excluded or not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if combined.search(line):
                      matches.append(f"{normalized}:{line_number}:{line}")

          report_lines = [
              "# Quick I Ching brand migration residual audit",
              "",
              "Changed files:",
              *[f"- {path}" for path in changed],
              "",
              "Residual matches requiring semantic review:",
              *(matches if matches else ["None"]),
          ]
          pathlib.Path("docs/brand-audit.txt").write_text("\n".join(report_lines) + "\n", encoding="utf-8")
          print("\n".join(report_lines))
          PY

      - name: Commit brand migration changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Brand migration produced no changes."
          else
            git commit -m "Rename product branding to Quick I Ching"
            git push
          fi
