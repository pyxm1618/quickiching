name: one-shot-creem-inventory

on:
  push:
    branches:
      - agent/v2-1-audit-remediation
    paths:
      - .github/workflows/one-shot-creem-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build exact inventory
        run: |
          {
            echo '# Active Creem references'
            echo
            git grep -in -E 'creem' -- . ':!bun.lock' || true
            echo
            echo '# Lockfile references'
            git grep -in -E 'creem' -- bun.lock || true
          } > docs/creem-inventory.txt
      - name: Commit inventory
        run: |
          git rm .github/workflows/one-shot-creem-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/creem-inventory.txt
          git commit -m "docs: inventory Creem payment references"
          git push origin HEAD:agent/v2-1-audit-remediation
