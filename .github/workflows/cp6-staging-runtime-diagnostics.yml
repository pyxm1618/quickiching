name: CP6 Staging Runtime Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - codex/commercial-v2-cp6-repair
    paths:
      - .github/workflows/cp6-staging-runtime-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: cp6-staging-runtime-diagnostics
  cancel-in-progress: false

env:
  VERCEL_PROJECT_ID: prj_iKtw9xKmIlEfe44gEocgLr2QDLfE
  VERCEL_PROJECT_NAME: quickiching-staging
  VERCEL_TEAM_ID: team_z1b9TTQtbNkr43dzs5JVJPnQ
  GITHUB_REPO_ID: "1317018295"
  STAGING_ORIGIN: https://staging.quickiching.com

jobs:
  diagnose:
    name: Deploy exact staging Production SHA and inspect runtime
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Lock execution scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is missing"; exit 1; }
          test "${GITHUB_REF_NAME}" = "codex/commercial-v2-cp6-repair" || {
            echo "::error::Ref must be codex/commercial-v2-cp6-repair, got ${GITHUB_REF_NAME}"
            exit 1
          }
          test "${VERCEL_PROJECT_ID}" = "prj_iKtw9xKmIlEfe44gEocgLr2QDLfE"
          test "${VERCEL_PROJECT_NAME}" = "quickiching-staging"
          test "${VERCEL_TEAM_ID}" = "team_z1b9TTQtbNkr43dzs5JVJPnQ"
          test "${GITHUB_REPO_ID}" = "1317018295"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install PostgreSQL tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Re-run deterministic CP6 gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/codex/commercial-v2-cp6...HEAD
          node scripts/check-migration-integrity.mjs
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bunx drizzle-kit check
          node scripts/test-postgres-serial.mjs

      - name: Record current staging Production baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v13/deployments/staging.quickiching.com?teamId=${VERCEL_TEAM_ID}")"

          baseline_id="$(jq -r '.id // empty' <<<"$response")"
          baseline_state="$(jq -r '.readyState // .state // empty' <<<"$response")"
          baseline_target="$(jq -r '.target // empty' <<<"$response")"
          test -n "$baseline_id" || { echo "::error::Could not resolve current staging Production deployment."; exit 1; }
          test "$baseline_state" = "READY" || { echo "::error::Current staging baseline is not READY: ${baseline_state}"; exit 1; }
          test "$baseline_target" = "production" || { echo "::error::Current staging baseline is not a Production deployment."; exit 1; }

          echo "baseline_id=${baseline_id}" >> "$GITHUB_OUTPUT"
          echo "Recorded current staging baseline ${baseline_id}."

      - name: Verify no maintenance token already exists
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env")"
          if jq -e '.envs[]? | select(.key == "CP6_STAGING_MAINTENANCE_TOKEN" and ((.target == "production") or ((.target | type) == "array" and (.target | index("production") != null))))' \
            >/dev/null <<<"$response"; then
            echo "::error::CP6_STAGING_MAINTENANCE_TOKEN already exists; refusing to overwrite or delete an existing credential."
            exit 1
          fi

      - name: Create one-time maintenance token
        id: maintenance
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"

          payload="$(jq -n --arg value "$token" '[{
            key: "CP6_STAGING_MAINTENANCE_TOKEN",
            value: $value,
            type: "sensitive",
            target: ["production"],
            comment: "Temporary CP6 staging runtime diagnostics token; auto-removed by GitHub Actions"
          }]')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" \
            >/dev/null

          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env")"
          env_id="$(jq -r '.envs[]? | select(.key == "CP6_STAGING_MAINTENANCE_TOKEN") | .id' <<<"$response" | head -n1)"
          test -n "$env_id" && test "$env_id" != "null" || {
            echo "::error::Temporary Vercel environment variable was created but could not be resolved by ID."
            exit 1
          }

          echo "token=${token}" >> "$GITHUB_OUTPUT"
          echo "env_id=${env_id}" >> "$GITHUB_OUTPUT"

      - name: Create exact-SHA staging Production deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --argjson repoId "$GITHUB_REPO_ID" \
            '{
              name: $name,
              project: $project,
              target: "production",
              gitSource: { type: "github", repoId: $repoId, ref: $ref, sha: $sha },
              gitMetadata: {
                commitRef: $ref,
                commitSha: $sha,
                commitMessage: "CP6 staging runtime diagnostics",
                ci: true,
                ciType: "github-actions"
              }
            }')"

          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.vercel.com/v13/deployments?forceNew=1")"

          deployment_id="$(jq -r '.id // empty' <<<"$response")"
          test -n "$deployment_id" || { echo "::error::Vercel deployment response did not include an ID."; exit 1; }
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          echo "Created deployment ${deployment_id} for exact SHA ${GITHUB_SHA}."

      - name: Wait for exact deployment readiness
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="${{ steps.deploy.outputs.deployment_id }}"
          for attempt in $(seq 1 180); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Accept: application/json" \
              "https://api.vercel.com/v13/deployments/${deployment_id}?withGitRepoInfo=true&teamId=${VERCEL_TEAM_ID}")"
            state="$(jq -r '.readyState // .status // empty' <<<"$response")"
            actual_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' <<<"$response")"
            if [ -n "$actual_sha" ] && [ "$actual_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Deployment identity mismatch: expected ${GITHUB_SHA}, got ${actual_sha}"
              exit 1
            fi
            case "$state" in
              READY)
                echo "Deployment ${deployment_id} is READY after ${attempt} checks."
                exit 0
                ;;
              ERROR|CANCELED)
                echo "::error::Deployment ${deployment_id} entered ${state}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out after approximately 30 minutes waiting for deployment readiness"
          exit 1

      - name: Read staging Runtime diagnostics
        id: diagnostics
        shell: bash
        env:
          MAINTENANCE_TOKEN: ${{ steps.maintenance.outputs.token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${MAINTENANCE_TOKEN}"
          diagnostics_file="$RUNNER_TEMP/cp6-staging-runtime-diagnostics.json"
          success=false
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output "$diagnostics_file" --write-out "%{http_code}" \
              -H "Authorization: Bearer ${MAINTENANCE_TOKEN}" \
              "${STAGING_ORIGIN}/api/internal/cp6-staging-diagnostics")"
            if [ "$status" = "200" ]; then success=true; break; fi
            if [ "$status" != "404" ] && [ "$status" != "401" ] && [ "$status" != "502" ] && [ "$status" != "503" ]; then
              echo "::error::Unexpected diagnostics HTTP status ${status}"
              cat "$diagnostics_file"
              exit 1
            fi
            sleep 5
          done
          [ "$success" = true ] || { echo "::error::Staging diagnostics endpoint never became available."; exit 1; }

          jq . "$diagnostics_file"
          test "$(jq -r '.deployment.gitSha // empty' "$diagnostics_file")" = "$GITHUB_SHA"
          test "$(jq -r '.deployment.environment // empty' "$diagnostics_file")" = "production"
          test "$(jq -r '.deployment.projectIdMatchesStaging // false' "$diagnostics_file")" = "true"
          test "$(jq -r '.deployment.productionUrlMatchesStaging // false' "$diagnostics_file")" = "true"
          test "$(jq -r '.deployment.tierConfigured // false' "$diagnostics_file")" = "true"
          test "$(jq -r '.deployment.appBaseUrlMatchesStaging // false' "$diagnostics_file")" = "true"
          cp "$diagnostics_file" cp6-staging-runtime-diagnostics.json

      - name: Upload non-sensitive diagnostics evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp6-staging-runtime-diagnostics-${{ github.sha }}
          path: cp6-staging-runtime-diagnostics.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove token, restore baseline, and delete diagnostic deployment
        if: always() && steps.maintenance.outcome != 'skipped'
        shell: bash
        run: |
          set -uo pipefail
          cleanup_failed=0
          env_id="${{ steps.maintenance.outputs.env_id }}"
          deployment_id="${{ steps.deploy.outputs.deployment_id }}"
          baseline_id="${{ steps.baseline.outputs.baseline_id }}"

          # Always try to remove the temporary project credential first.
          if [ -z "$env_id" ]; then
            response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Accept: application/json" \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env")" || response=""
            env_id="$(jq -r '.envs[]? | select(.key == "CP6_STAGING_MAINTENANCE_TOKEN") | .id' <<<"$response" 2>/dev/null | head -n1)"
          fi
          if [ -n "$env_id" ] && [ "$env_id" != "null" ]; then
            token_delete_http="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/token-delete.json" \
              --write-out "%{http_code}" \
              -X DELETE \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${env_id}?teamId=${VERCEL_TEAM_ID}")"
            if [ "$token_delete_http" != "200" ] && [ "$token_delete_http" != "404" ]; then
              echo "::error::Could not remove temporary maintenance token; HTTP ${token_delete_http}."
              cat "$RUNNER_TEMP/token-delete.json" || true
              cleanup_failed=1
            else
              echo "Temporary maintenance token removal returned HTTP ${token_delete_http}."
            fi
          fi

          if [ -z "$deployment_id" ]; then
            [ "$cleanup_failed" -eq 0 ] || exit 1
            exit 0
          fi
          if [ -z "$baseline_id" ]; then
            echo "::error::Missing recorded staging baseline; refusing unsafe deployment cleanup."
            exit 1
          fi

          current_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v13/deployments/staging.quickiching.com?teamId=${VERCEL_TEAM_ID}")" || current_response=""
          current_id="$(jq -r '.id // empty' <<<"$current_response" 2>/dev/null)"
          current_state="$(jq -r '.readyState // .state // empty' <<<"$current_response" 2>/dev/null)"
          restored=false

          if [ "$current_id" = "$baseline_id" ] && [ "$current_state" = "READY" ]; then
            echo "Original staging baseline is already serving; skipping redundant promote."
            restored=true
          elif [ "$current_id" = "$deployment_id" ]; then
            echo "Diagnostic deployment is serving staging; restoring recorded baseline before deletion."
            promote_http="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/promote-baseline.json" \
              --write-out "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${baseline_id}?teamId=${VERCEL_TEAM_ID}")"
            if [ "$promote_http" != "201" ] && [ "$promote_http" != "202" ] && [ "$promote_http" != "200" ] && [ "$promote_http" != "409" ]; then
              echo "::warning::Promote baseline returned HTTP ${promote_http}; will verify actual routing before deciding cleanup result."
              cat "$RUNNER_TEMP/promote-baseline.json" || true
            fi

            for attempt in $(seq 1 30); do
              verify_response="$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Accept: application/json" \
                "https://api.vercel.com/v13/deployments/staging.quickiching.com?teamId=${VERCEL_TEAM_ID}")" || verify_response=""
              verify_id="$(jq -r '.id // empty' <<<"$verify_response" 2>/dev/null)"
              verify_state="$(jq -r '.readyState // .state // empty' <<<"$verify_response" 2>/dev/null)"
              if [ "$verify_id" = "$baseline_id" ] && [ "$verify_state" = "READY" ]; then
                restored=true
                break
              fi
              sleep 5
            done
          else
            echo "::error::Unexpected staging Production deployment ${current_id:-unknown}; expected baseline ${baseline_id} or diagnostic ${deployment_id}."
            cleanup_failed=1
          fi

          if [ "$restored" = true ]; then
            delete_http="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/diagnostic-delete.json" \
              --write-out "%{http_code}" \
              -X DELETE \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_TEAM_ID}")"
            if [ "$delete_http" != "200" ] && [ "$delete_http" != "404" ]; then
              echo "::error::Diagnostic deployment revoke returned HTTP ${delete_http}."
              cat "$RUNNER_TEMP/diagnostic-delete.json" || true
              cleanup_failed=1
            else
              echo "Diagnostic deployment revoke returned HTTP ${delete_http}."
            fi
          else
            echo "::error::Original staging baseline could not be proven restored; refusing to delete a deployment that may still be serving."
            cleanup_failed=1
          fi

          # Prove the project credential is absent after cleanup.
          final_env_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env")" || final_env_response=""
          if jq -e '.envs[]? | select(.key == "CP6_STAGING_MAINTENANCE_TOKEN" and ((.target == "production") or ((.target | type) == "array" and (.target | index("production") != null))))' >/dev/null <<<"$final_env_response" 2>/dev/null; then
            echo "::error::Temporary maintenance token still exists after cleanup."
            cleanup_failed=1
          else
            echo "Temporary maintenance token is absent after cleanup."
          fi

          final_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.vercel.com/v13/deployments/staging.quickiching.com?teamId=${VERCEL_TEAM_ID}")" || final_response=""
          final_id="$(jq -r '.id // empty' <<<"$final_response" 2>/dev/null)"
          final_state="$(jq -r '.readyState // .state // empty' <<<"$final_response" 2>/dev/null)"
          if [ "$final_id" != "$baseline_id" ] || [ "$final_state" != "READY" ]; then
            echo "::error::Final staging baseline verification failed: id=${final_id:-unknown}, state=${final_state:-unknown}."
            cleanup_failed=1
          fi

          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/cp6-after-cleanup.txt" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer invalid-after-cleanup" \
            "${STAGING_ORIGIN}/api/internal/cp6-staging-diagnostics")"
          if [ "$status" != "404" ]; then
            echo "::error::Diagnostics route remained reachable after cleanup; got HTTP ${status}."
            cat "$RUNNER_TEMP/cp6-after-cleanup.txt" || true
            cleanup_failed=1
          else
            echo "Diagnostics route is hidden again (404)."
          fi

          [ "$cleanup_failed" -eq 0 ] || exit 1
          echo "Original staging baseline verified, temporary credential absent, diagnostic deployment revoked."
