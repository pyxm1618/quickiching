name: Payment closeout provider-order patch

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths: [.github/workflows/payment-closeout-order-id-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/waffo-payment-closeout
      - name: Apply exact provider order identity patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server/payments/waffo-authority.ts')
          s = p.read_text()
          old = '''        const providerOrderId = string(payment.orderId, "payment.orderId");\n        const merchantOrderReference = string(payment.orderMerchantExternalId, "payment.orderMerchantExternalId");'''
          new = '''        const providerOrderId = string(payment.orderId, "payment.orderId");\n        if (input.expectedProviderOrderId && providerOrderId !== input.expectedProviderOrderId) return { status: "contract_error" };\n        const merchantOrderReference = string(payment.orderMerchantExternalId, "payment.orderMerchantExternalId");'''
          if s.count(old) != 1:
              raise SystemExit(f'providerOrderId anchor count={s.count(old)}')
          s = s.replace(old, new)
          old2 = '''        providerPaymentId: input.providerPaymentId,\n        expectedProviderProductId: input.expectedProviderProductId,'''
          new2 = '''        providerPaymentId: input.providerPaymentId,\n        expectedProviderOrderId: input.expectedProviderOrderId,\n        expectedProviderProductId: input.expectedProviderProductId,'''
          if s.count(old2) != 1:
              raise SystemExit(f'refund read anchor count={s.count(old2)}')
          s = s.replace(old2, new2)
          p.write_text(s)
          Path('.github/workflows/payment-closeout-order-id-patch.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(payment): verify provider order identity on reads"
          git push origin HEAD:fix/waffo-payment-closeout
