name: sync-next-eslint

on:
  push:
    branches:
      - agent/v2-1-jobs-release
    paths:
      - .github/workflows/sync-next-eslint.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-jobs-release
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun add -d eslint-config-next@15.5.22
      - name: Commit aligned lint runtime and remove installer
        run: |
          rm .github/workflows/sync-next-eslint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock .github/workflows/sync-next-eslint.yml
          git commit -m "build: align Next ESLint runtime"
          git push origin HEAD:agent/v2-1-jobs-release
