name: Payment Closeout Staging Waffo Read

on:
  push:
    branches: [fix/waffo-payment-closeout]
    paths:
      - .github/workflows/payment-closeout-staging-waffo-read.yml
      - scripts/payment-closeout-staging-waffo-read.ts
      - src/server/payments/waffo-product-readiness.ts
      - src/server/payments/waffo-product-readiness.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    name: Authenticated Waffo Test 1/3/5 catalog read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify catalog validator contract
        run: bunx vitest run src/server/payments/waffo-product-readiness.test.ts
      - name: Execute authenticated Waffo Test catalog READ only
        run: bun scripts/payment-closeout-staging-waffo-read.ts
