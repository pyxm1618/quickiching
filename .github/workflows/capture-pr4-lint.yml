name: capture-pr4-lint

on:
  push:
    branches:
      - agent/v2-1-postgres

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-postgres
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Capture lint result
        shell: bash
        run: |
          set +e
          bun run lint > pr4-lint-diagnostic.txt 2>&1
          status=$?
          printf '\nLINT_EXIT_CODE=%s\n' "$status" >> pr4-lint-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr4-lint-diagnostic.txt
          git commit -m "chore: capture PR4 lint diagnostic"
          git push origin HEAD:agent/v2-1-postgres
