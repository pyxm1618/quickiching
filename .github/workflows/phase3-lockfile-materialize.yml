name: Phase 3 Lockfile Materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'fix/phase3-security-runtime-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Resolve lockfile through the canonical npm registry
        run: |
          set -euo pipefail
          bun install --lockfile-only --registry=https://registry.npmjs.org
          node - <<'NODE' > phase3-lock-report.txt
          const fs = require("fs");
          const lock = fs.readFileSync("bun.lock", "utf8");
          const mirror = (lock.match(/registry\.npmmirror\.com/g) || []).length;
          const npm = (lock.match(/registry\.npmjs\.org/g) || []).length;
          console.log("npmmirror=" + mirror);
          console.log("npmjs=" + npm);
          console.log("betterAuth1725=" + (lock.includes('better-auth@1.7.25') || lock.includes('better-auth", "1.7.25')));
          NODE
          cat phase3-lock-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3a-lockfile
          path: |
            bun.lock
            phase3-lock-report.txt
          if-no-files-found: error
          retention-days: 2
