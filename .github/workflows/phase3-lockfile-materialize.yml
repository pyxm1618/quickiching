name: Phase 3 Lockfile Materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'fix/phase3-security-runtime-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/phase3-security-runtime-hardening
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Resolve and commit the Phase 3A dependency lock
        run: |
          set -euo pipefail
          bun install --lockfile-only
          bun install --frozen-lockfile
          grep -q '"better-auth": "1.7.25"' bun.lock
          grep -q '"@better-auth/drizzle-adapter": "1.7.25"' bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock already current"
          else
            git commit -m "chore: update Better Auth lockfile"
            git push origin HEAD:fix/phase3-security-runtime-hardening
          fi
