name: one-shot-production-blockers

on:
  push:
    branches:
      - agent/v2-1-audit-remediation
    paths:
      - tools/one-shot-production-blockers.py
      - .github/workflows/one-shot-production-blockers.yml

permissions:
  contents: write

concurrency:
  group: one-shot-production-blockers
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iching_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AI_ADAPTER_MODE: local
      AUTH_ADAPTER_MODE: dev
      PAYMENT_ADAPTER_MODE: simulated
      DATABASE_ADAPTER_MODE: memory
      WORKFLOW_ADAPTER_MODE: local
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/iching_test
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/iching_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply reviewed patch
        run: python tools/one-shot-production-blockers.py
      - name: Fix generated sign-in link contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/cast/result-reading-controls.tsx")
          text = path.read_text()
          old = '''          <Button asChild size="sm" className="mt-3">
            <Link href={`/signin?callbackURL=${encodeURIComponent(`/result/${props.castingId}`)}`}>Sign in</Link>
          </Button>'''
          new = '''          <Link
            href={`/signin?callbackURL=${encodeURIComponent(`/result/${props.castingId}`)}`}
            className="mt-3 inline-flex h-9 items-center justify-center rounded bg-[var(--cinnabar)] px-3 text-sm font-semibold text-[var(--primary-foreground)]"
          >
            Sign in
          </Link>'''
          if text.count(old) != 1:
              raise SystemExit("result sign-in link contract not found exactly once")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify dependency lock
        run: bun install --frozen-lockfile
      - name: Verify migrations
        run: bun run db:migrate
      - name: Verify source
        run: |
          git diff --check
          bun run lint
          bun run typecheck
          bun run test --reporter=dot
          bun run build
      - name: Commit verified remediation
        run: |
          git rm tools/one-shot-production-blockers.py .github/workflows/one-shot-production-blockers.yml
          rm -f docs/production-blocker-remediation-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close production casting and result blockers"
          git push origin HEAD:agent/v2-1-audit-remediation
      - name: Record failure run
        if: failure()
        run: |
          cat > docs/production-blocker-remediation-failure.txt <<EOF
          run_id=${{ github.run_id }}
          run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          head_sha=${{ github.sha }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/production-blocker-remediation-failure.txt
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: record production blocker remediation failure"
          else
            git commit -m "chore: record production blocker remediation failure"
          fi
          git push origin HEAD:agent/v2-1-audit-remediation
