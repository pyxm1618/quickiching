name: apply-pr2-patches

on:
  push:
    branches:
      - agent/v2-1-risk-output

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-risk-output
          fetch-depth: 0
      - run: python3 scripts/apply-pr2-text-patches.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate risk clarification and generation gates"
          git push origin HEAD:agent/v2-1-risk-output
