name: Refresh legal prelaunch lockfile

on:
  push:
    branches:
      - agent/legal-prelaunch
    paths:
      - package.json
      - .github/workflows/legal-prelaunch-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/legal-prelaunch
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Refresh lockfile
        run: bun install

      - name: Verify frozen installation
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: bun run build

      - name: Commit verified lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/legal-prelaunch-lock.yml
          git add package.json bun.lock
          git commit -m "Upgrade Next.js security patch"
          git push origin HEAD:agent/legal-prelaunch
