name: Group 3 Account + Info Visual QA

on:
  pull_request:
    branches:
      - integration/quickiching-ui-redesign
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: group3-account-info-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: Account + Info build, browser, responsive, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GROUP3_VISUAL_QA: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate optimized Info asset candidates
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p public/info-pages/runtime/{shared,decorative,guide,legal,help}
          mkdir -p .artifacts/group3-visual-qa/optimized-assets
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          files = [
            ("public/info-pages/shared/info-page-background.png", "public/info-pages/runtime/shared/info-page-background.webp", 88),
            ("public/info-pages/shared/title-brush-stroke.png", "public/info-pages/runtime/shared/title-brush-stroke.webp", 90),
            ("public/info-pages/decorative/guide-decorations.png", "public/info-pages/runtime/decorative/guide-decorations.webp", 90),
            ("public/info-pages/guide/guide-main-scroll.png", "public/info-pages/runtime/guide/guide-main-scroll.webp", 90),
            ("public/info-pages/guide/guide-secondary-scroll.png", "public/info-pages/runtime/guide/guide-secondary-scroll.webp", 90),
            ("public/info-pages/legal/legal-main-paper.png", "public/info-pages/runtime/legal/legal-main-paper.webp", 90),
            ("public/info-pages/legal/legal-toc-panel.png", "public/info-pages/runtime/legal/legal-toc-panel.webp", 90),
            ("public/info-pages/help/help-main-panel.png", "public/info-pages/runtime/help/help-main-panel.webp", 90),
          ]
          for src, dst, quality in files:
              im = Image.open(src)
              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              im.save(dst, "WEBP", quality=quality, method=6)
              print(src, Path(src).stat().st_size, "=>", dst, Path(dst).stat().st_size)
          PY

      - name: Persist optimized Info runtime assets
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/group3-head
          git clone --quiet --depth=1 --branch "$HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/group3-head
          mkdir -p /tmp/group3-head/public/info-pages/runtime
          cp -R public/info-pages/runtime/. /tmp/group3-head/public/info-pages/runtime/
          cd /tmp/group3-head
          if git diff --quiet -- public/info-pages/runtime && [ -z "$(git ls-files --others --exclude-standard public/info-pages/runtime)" ]; then
            echo "Optimized Info runtime assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/info-pages/runtime
          git commit -m "perf: add optimized Info runtime assets"
          git push --quiet origin "HEAD:$HEAD_REF"

      - name: Stage optimized asset evidence
        run: |
          cp -R public/info-pages/runtime/. .artifacts/group3-visual-qa/optimized-assets/

      - name: Install temporary visual fixture
        run: node scripts/group3-visual-qa-fixture.mjs install

      - name: Diff whitespace hygiene
        run: git diff --check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Existing runtime asset gate
        run: node scripts/performance-asset-gate.mjs

      - name: Install browser QA tools
        run: bun add --no-save --cache-dir=/tmp/quickiching-group3-bun-cache puppeteer-core@24 lighthouse@13.4.1

      - name: Resolve Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "System Chrome is required" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Start production server
        shell: bash
        run: |
          mkdir -p .artifacts/group3-visual-qa
          (GROUP3_VISUAL_QA=1 PORT=3036 HOSTNAME=127.0.0.1 bun run start > .artifacts/group3-visual-qa/server.log 2>&1 & echo $! > .artifacts/group3-visual-qa/server.pid)
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat .artifacts/group3-visual-qa/server.log
          exit 1

      - name: Capture Account + Info desktop / 390 / 320
        id: capture
        continue-on-error: true
        run: node scripts/group3-visual-capture.mjs .artifacts/group3-visual-qa

      - name: Lighthouse - Info
        id: lighthouse_info
        continue-on-error: true
        shell: bash
        run: |
          "$PWD/node_modules/.bin/lighthouse" http://127.0.0.1:3036/guides/how-to-ask-the-i-ching             --quiet --preset=desktop             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"             --only-categories=performance,accessibility,seo             --output=json --output-path=.artifacts/group3-visual-qa/lighthouse-info.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.artifacts/group3-visual-qa/lighthouse-info.json','utf8'));
          const metrics={
            performance:Math.round(r.categories.performance.score*100),
            accessibility:Math.round(r.categories.accessibility.score*100),
            seo:Math.round(r.categories.seo.score*100),
            lcp:Math.round(r.audits['largest-contentful-paint'].numericValue),
            cls:Number(r.audits['cumulative-layout-shift'].numericValue.toFixed(3)),
            tbt:Math.round(r.audits['total-blocking-time'].numericValue)
          };
          fs.writeFileSync('.artifacts/group3-visual-qa/lighthouse-info-summary.json',JSON.stringify(metrics,null,2));
          console.log(metrics);
          if(metrics.performance<95||metrics.lcp>2750) process.exit(1);
          NODE

      - name: Lighthouse - Account visual fixture
        id: lighthouse_account
        continue-on-error: true
        shell: bash
        run: |
          "$PWD/node_modules/.bin/lighthouse" "http://127.0.0.1:3036/group3-visual-qa-local?view=account"             --quiet --preset=desktop             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"             --only-categories=performance,accessibility             --output=json --output-path=.artifacts/group3-visual-qa/lighthouse-account.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.artifacts/group3-visual-qa/lighthouse-account.json','utf8'));
          const metrics={
            performance:Math.round(r.categories.performance.score*100),
            accessibility:Math.round(r.categories.accessibility.score*100),
            lcp:Math.round(r.audits['largest-contentful-paint'].numericValue),
            cls:Number(r.audits['cumulative-layout-shift'].numericValue.toFixed(3)),
            tbt:Math.round(r.audits['total-blocking-time'].numericValue)
          };
          fs.writeFileSync('.artifacts/group3-visual-qa/lighthouse-account-summary.json',JSON.stringify(metrics,null,2));
          console.log(metrics);
          if(metrics.performance<95||metrics.lcp>2750) process.exit(1);
          NODE

      - name: Remove temporary visual fixture source
        if: always()
        run: node scripts/group3-visual-qa-fixture.mjs remove

      - name: Verify fixture cleanup
        if: always()
        shell: bash
        run: |
          test ! -e "src/app/(default)/group3-visual-qa-local"
          git diff --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group3-account-info-visual-qa
          path: .artifacts/group3-visual-qa
          if-no-files-found: warn
          retention-days: 5

      - name: Enforce browser and performance gates
        if: always()
        shell: bash
        run: |
          status=0
          [ "${{ steps.capture.outcome }}" = "success" ] || status=1
          [ "${{ steps.lighthouse_info.outcome }}" = "success" ] || status=1
          [ "${{ steps.lighthouse_account.outcome }}" = "success" ] || status=1
          exit "$status"
