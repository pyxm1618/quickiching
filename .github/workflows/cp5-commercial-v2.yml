name: CP5 Commercial V2 Gates

on:
  pull_request:
    branches:
      - codex/commercial-v2-cp4-repair
  push:
    branches:
      - codex/commercial-v2-cp5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp5-commercial-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    name: Apply stale-worker fence patch
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/commercial-v2-cp5
          fetch-depth: 1
      - name: Patch exact stale-worker condition
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/server/payments/postgres-repository.ts")
          text = path.read_text()
          old = '''      // If lease token was provided and does not match outbox lease token, fail-stop
          if (leaseToken && row.outbox_lease_token && row.outbox_lease_token !== leaseToken) {
            return { deadLetter: false, attemptCount: Number(row.attempt_count) };
          }
          '''
          new = '''      // Supplying a lease token is an ownership claim. Exact equality is
          // required even when the persisted token is NULL, and only a processing
          // row may be failed by a leased worker.
          if (
            leaseToken !== undefined
            && (row.outbox_status !== "processing" || row.outbox_lease_token !== leaseToken)
          ) {
            return { deadLetter: false, attemptCount: Number(row.attempt_count) };
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale-worker target, got {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit source-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/payments/postgres-repository.ts
          git diff --cached --check
          git commit -m "fix(cp5): fence stale payment failure workers"
          git push origin HEAD:codex/commercial-v2-cp5

  application:
    name: Lint, typecheck, unit, drizzle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Drizzle migration metadata check
        run: bunx drizzle-kit check

  postgres:
    name: PostgreSQL serial integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          PG_BINDIR="$(pg_config --bindir)"
          echo "$PG_BINDIR" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run PostgreSQL serial suite
        run: bun run test:postgres:serial
