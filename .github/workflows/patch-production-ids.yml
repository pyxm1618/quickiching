name: patch-production-ids

on:
  push:
    branches:
      - agent/v2-1-jobs-release
    paths:
      - .github/workflows/patch-production-ids.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-jobs-release
      - name: Apply exact prefixed ID contract patch
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'src/server/runtime/postgres-application.ts': [
              ('return `${prefix}_${randomUUID().replaceAll("-", "")}`;', 'return `${prefix}_${randomUUID().replaceAll("-", "").slice(0, 24)}`;'),
            ],
            'src/server/repositories/postgres/generation-repository.ts': [
              ('return `${prefix}_${randomUUID().replaceAll("-", "")}`;', 'return `${prefix}_${randomUUID().replaceAll("-", "").slice(0, 24)}`;'),
            ],
          }
          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{filename}: expected one match, found {count}')
              text = text.replace(old, new)
            path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-production-ids.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/runtime/postgres-application.ts src/server/repositories/postgres/generation-repository.ts .github/workflows/patch-production-ids.yml
          git commit -m "fix: preserve prefixed 24-hex domain identifiers"
          git push origin HEAD:agent/v2-1-jobs-release
