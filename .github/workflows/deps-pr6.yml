name: install-pr6-dependencies

on:
  push:
    branches:
      - agent/v2-1-jobs-ai-release
    paths:
      - .github/workflows/deps-pr6.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-1-jobs-ai-release
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun add ai workflow
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "add AI SDK and Workflow dependencies"
          git push origin HEAD:agent/v2-1-jobs-ai-release
