name: Public SEO V1 Launch Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-gate:
    name: Bun + Production Browser + Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Tool versions
        run: |
          node --version
          bun --version
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Run complete Public SEO V1 launch gate
        run: node scripts/vercel-build.mjs
