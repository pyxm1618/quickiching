name: One-shot payment closeout patch

on:
  push:
    branches:
      - fix/waffo-payment-closeout
    paths:
      - .github/workflows/one-shot-closeout-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/waffo-payment-closeout
      - name: Patch the single stale migration-count assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/server/payments/postgres-repository.integration.test.ts')
          text = path.read_text()
          old = 'expect(migrations[0]?.count).toBe("11");'
          new = 'expect(migrations[0]?.count).toBe("12");'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit the exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/payments/postgres-repository.integration.test.ts
          git diff --cached --check
          test "$(git diff --cached --numstat | wc -l)" -eq 1
          git commit -m "test(db): include closeout migration in payment count"
          git push origin HEAD:fix/waffo-payment-closeout
