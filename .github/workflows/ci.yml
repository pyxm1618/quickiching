        if: needs.select.outputs.performance == 'true'
        run: node scripts/performance-asset-gate.mjs
      - name: Install pinned Lighthouse browser stack
        if: needs.select.outputs.performance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('config/performance-gates.json','utf8')).tooling;
          console.log('LIGHTHOUSE_VERSION='+c.lighthouse);
          console.log('PUPPETEER_VERSION='+c.puppeteerCore);
          console.log('CHROMIUM_VERSION='+c.chromium);
          NODE
          )"
          bun add --no-save --cache-dir=/tmp/quickiching-ci-lighthouse-cache             "puppeteer-core@$PUPPETEER_VERSION" "@sparticuz/chromium@$CHROMIUM_VERSION" "lighthouse@$LIGHTHOUSE_VERSION"
          CHROME_PATH="$(node -e 'import("@sparticuz/chromium").then(async m=>process.stdout.write(await m.default.executablePath()))')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Start performance server
        if: needs.select.outputs.performance == 'true'
        shell: bash
        run: |
          (GROUP3_VISUAL_QA=1 PORT=3036 HOSTNAME=127.0.0.1 bun run start > /tmp/qic-ci-performance.log 2>&1 & echo $! > /tmp/qic-ci-performance.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-performance.log
          exit 1
      - name: Targeted Lighthouse
        if: needs.select.outputs.performance == 'true'
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          CI_PERFORMANCE_TARGETS: ${{ needs.select.outputs.performance_targets }}
        run: node scripts/ci/lighthouse-gate.mjs
      - name: Upload Lighthouse evidence
        if: always() && needs.select.outputs.performance == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-lighthouse-evidence
          path: .artifacts/ci-lighthouse
          if-no-files-found: warn
          retention-days: 3
      - name: Stop performance server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qic-ci-performance.pid ]; then kill "$(cat /tmp/qic-ci-performance.pid)" 2>/dev/null || true; fi
      - name: Remove Account performance fixture
        if: always() && needs.select.outputs.performance == 'true' && contains(needs.select.outputs.performance_targets, 'account.desktop')
        run: node scripts/group3-visual-qa-fixture.mjs remove

  required:
    name: CI / Required
    if: always()
    needs: [select, fast, build, schema, database, reading, reading_lifecycle, seo_static, public_seo_browser, locale_browser, navigation, auth_lifecycle, account_info, hexagram, security, payment_refund, performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce required gate results
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCHEMA_RESULT: ${{ needs.schema.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          READING_RESULT: ${{ needs.reading.result }}
          READING_LIFECYCLE_RESULT: ${{ needs.reading_lifecycle.result }}
          SEO_STATIC_RESULT: ${{ needs.seo_static.result }}
          SEO_BROWSER_RESULT: ${{ needs.public_seo_browser.result }}
          LOCALE_BROWSER_RESULT: ${{ needs.locale_browser.result }}
          NAVIGATION_RESULT: ${{ needs.navigation.result }}
          AUTH_LIFECYCLE_RESULT: ${{ needs.auth_lifecycle.result }}
          ACCOUNT_INFO_RESULT: ${{ needs.account_info.result }}
          HEXAGRAM_RESULT: ${{ needs.hexagram.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PAYMENT_REFUND_RESULT: ${{ needs.payment_refund.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          BUILD_SELECTED: ${{ needs.select.outputs.build }}
          SCHEMA_SELECTED: ${{ needs.select.outputs.schema }}
          DATABASE_SELECTED: ${{ needs.select.outputs.database }}
          READING_SELECTED: ${{ needs.select.outputs.reading }}
          READING_LIFECYCLE_SELECTED: ${{ needs.select.outputs.reading_lifecycle }}
          SEO_STATIC_SELECTED: ${{ needs.select.outputs.seo_static }}
          SEO_BROWSER_SELECTED: ${{ needs.select.outputs.seo_browser }}
          LOCALE_BROWSER_SELECTED: ${{ needs.select.outputs.locale_browser }}
          NAVIGATION_SELECTED: ${{ needs.select.outputs.navigation }}
          AUTH_LIFECYCLE_SELECTED: ${{ needs.select.outputs.auth_lifecycle }}
          ACCOUNT_INFO_SELECTED: ${{ needs.select.outputs.account_info }}
          HEXAGRAM_SELECTED: ${{ needs.select.outputs.hexagram_detail }}
          SECURITY_SELECTED: ${{ needs.select.outputs.security }}
          PAYMENT_REFUND_SELECTED: ${{ needs.select.outputs.payment_refund }}
          PERFORMANCE_SELECTED: ${{ needs.select.outputs.performance }}
        run: node scripts/ci/required-gate.mjs
