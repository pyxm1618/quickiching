name: ci

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iching
          POSTGRES_PASSWORD: iching
          POSTGRES_DB: iching_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iching -d iching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AI_ADAPTER_MODE: local
      AUTH_ADAPTER_MODE: dev
      PAYMENT_ADAPTER_MODE: simulated
      DATABASE_ADAPTER_MODE: memory
      WORKFLOW_ADAPTER_MODE: local
      TEST_DATABASE_URL: postgres://iching:iching@localhost:5432/iching_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Build credential-free application
        run: bun run build
