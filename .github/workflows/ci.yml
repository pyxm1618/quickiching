  auth_lifecycle:
    name: CI / Auth Lifecycle
    needs: select
    if: needs.select.outputs.auth_lifecycle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Reading local QA fixture
        run: node scripts/ritual-qa-fixture.mjs install
      - name: Install PostgreSQL tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Prepare PostgreSQL for real auth browser gates
        shell: bash
        run: |
          set -euo pipefail
          PG_BINDIR="$(pg_config --bindir)"
          export PATH="$PG_BINDIR:$PATH"
          rm -rf /tmp/qic-r3-postgres
          mkdir -p /tmp/qic-r3-postgres/socket
          initdb -D /tmp/qic-r3-postgres/data -A trust -U quickiching_r3 --no-locale --encoding=UTF8
          pg_ctl -D /tmp/qic-r3-postgres/data -o "-p 55432 -k /tmp/qic-r3-postgres/socket" -w start
          createdb -h 127.0.0.1 -p 55432 -U quickiching_r3 quickiching_r3
          R3_AUTH_DATABASE_URL="postgresql://quickiching_r3@127.0.0.1:55432/quickiching_r3"
          MIGRATION_DATABASE_URL="$R3_AUTH_DATABASE_URL" DATABASE_URL="$R3_AUTH_DATABASE_URL" bun run db:migrate
          echo "R3_AUTH_DATABASE_URL=$R3_AUTH_DATABASE_URL" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-22.23.2-bun-1.3.14-next-15.5.25-default-${{ hashFiles('bun.lock', 'next.config.mjs', 'tsconfig.json') }}
      - name: Build default production bundle for navigation context
        run: bun run build
      - name: Install pinned browser tools
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('config/performance-gates.json','utf8')).tooling;
          console.log('PUPPETEER_VERSION='+t.puppeteerCore);
          console.log('CHROMIUM_VERSION='+t.chromium);
          NODE
          )"
          bun add --no-save --cache-dir=/tmp/quickiching-ci-browser-cache "puppeteer-core@$PUPPETEER_VERSION" "@sparticuz/chromium@$CHROMIUM_VERSION"
          CHROME_PATH="$(node -e 'import("@sparticuz/chromium").then(async m=>process.stdout.write(await m.default.executablePath()))')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start default navigation-context server
        shell: bash
        run: |
          (RITUAL_VISUAL_QA=1 RITUAL_QA_HOST=127.0.0.1:3036 PORT=3036 HOSTNAME=127.0.0.1 bun run start > /tmp/qic-ci-auth-default.log 2>&1 & echo $! > /tmp/qic-ci-auth-default.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-auth-default.log
          exit 1
      - name: Start auth-surface server for navigation context
        shell: bash
        env:
          COMMERCIAL_V2_AUTH_ENABLED: "1"
          AUTH_ADAPTER_MODE: better-auth
          DATABASE_ADAPTER_MODE: postgres
          QUESTION_FINGERPRINT_KEYS: v1:ci-question-fingerprint-key-material-001
          QUESTION_ENCRYPTION_KEYS: v1:ci-question-encryption-key-material-002
          RESULT_INTEGRITY_KEYS: v1:ci-result-integrity-key-material-003
          ANONYMOUS_OWNER_KEYS: v1:ci-anonymous-owner-key-material-004
          BETTER_AUTH_SECRET: ci-better-auth-secret-material-0123456789ab
          BETTER_AUTH_URL: http://127.0.0.1:3037
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          RESEND_API_KEY: ci-resend-api-key
          EMAIL_FROM: ci@quickiching.test
          AUTH_BROWSER_FIXTURE: "1"
          AUTH_MAGIC_LINK_CAPTURE_FILE: /tmp/qic-r3-magic-link.json
        run: |
          set -euo pipefail
          export DATABASE_URL="$R3_AUTH_DATABASE_URL"
          rm -f /tmp/qic-r3-magic-link.json
          (PORT=3037 HOSTNAME=127.0.0.1 bun run start > /tmp/qic-ci-auth-surface.log 2>&1 & echo $! > /tmp/qic-ci-auth-surface.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3037/signin >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-auth-surface.log
          exit 1
      - name: Navigation Context / Locale Continuation Gate (R2)
        env:
          NAV_CONTEXT_TEST_BASE_URL: http://127.0.0.1:3036
          NAV_CONTEXT_AUTH_BASE_URL: http://127.0.0.1:3037
        run: node scripts/navigation-context-browser-gate.mjs
      - uses: actions/cache@v4
        with:
          path: .next-r3-auth/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-22.23.2-bun-1.3.14-next-15.5.25-r3-auth-${{ hashFiles('bun.lock', 'next.config.mjs', 'tsconfig.json') }}
      - name: Build isolated R3 auth-enabled production bundle
        shell: bash
        env:
          COMMERCIAL_V2_AUTH_ENABLED: "1"
          AUTH_ADAPTER_MODE: better-auth
          DATABASE_ADAPTER_MODE: postgres
          QUESTION_FINGERPRINT_KEYS: v1:ci-question-fingerprint-key-material-001
          QUESTION_ENCRYPTION_KEYS: v1:ci-question-encryption-key-material-002
          RESULT_INTEGRITY_KEYS: v1:ci-result-integrity-key-material-003
          ANONYMOUS_OWNER_KEYS: v1:ci-anonymous-owner-key-material-004
          BETTER_AUTH_SECRET: ci-better-auth-secret-material-0123456789ab
          BETTER_AUTH_URL: http://127.0.0.1:3038
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          RESEND_API_KEY: ci-resend-api-key
          EMAIL_FROM: ci@quickiching.test
          AUTH_BROWSER_FIXTURE: "1"
          AUTH_MAGIC_LINK_CAPTURE_FILE: /tmp/qic-r3-magic-link.json
          QIC_NEXT_DIST_DIR: .next-r3-auth
        run: |
          set -euo pipefail
          export DATABASE_URL="$R3_AUTH_DATABASE_URL"
          rm -rf .next-r3-auth
          bun run build
      - name: Start isolated R3 auth-enabled production runtime
        shell: bash
        env:
          COMMERCIAL_V2_AUTH_ENABLED: "1"
          AUTH_ADAPTER_MODE: better-auth
          DATABASE_ADAPTER_MODE: postgres
          QUESTION_FINGERPRINT_KEYS: v1:ci-question-fingerprint-key-material-001
          QUESTION_ENCRYPTION_KEYS: v1:ci-question-encryption-key-material-002
          RESULT_INTEGRITY_KEYS: v1:ci-result-integrity-key-material-003
          ANONYMOUS_OWNER_KEYS: v1:ci-anonymous-owner-key-material-004
          BETTER_AUTH_SECRET: ci-better-auth-secret-material-0123456789ab
          BETTER_AUTH_URL: http://127.0.0.1:3038
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          RESEND_API_KEY: ci-resend-api-key
          EMAIL_FROM: ci@quickiching.test
          AUTH_BROWSER_FIXTURE: "1"
          AUTH_MAGIC_LINK_CAPTURE_FILE: /tmp/qic-r3-magic-link.json
          QIC_NEXT_DIST_DIR: .next-r3-auth
        run: |
          set -euo pipefail
          export DATABASE_URL="$R3_AUTH_DATABASE_URL"
          rm -f /tmp/qic-r3-magic-link.json
          (PORT=3038 HOSTNAME=127.0.0.1 bun run start > /tmp/qic-ci-r3-auth.log 2>&1 & echo $! > /tmp/qic-ci-r3-auth.pid)
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:3038/signin >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-r3-auth.log
          exit 1
      - name: Reading Lifecycle Final Browser Gate (R3)
        env:
          READING_FINAL_AUTH_BASE_URL: http://127.0.0.1:3038
          R3_MAGIC_LINK_CAPTURE_FILE: /tmp/qic-r3-magic-link.json
        run: node scripts/reading-lifecycle-final-browser-gate.mjs
      - name: Stop Auth lifecycle services
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qic-ci-auth-default.pid ]; then kill "$(cat /tmp/qic-ci-auth-default.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/qic-ci-auth-surface.pid ]; then kill "$(cat /tmp/qic-ci-auth-surface.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/qic-ci-r3-auth.pid ]; then kill "$(cat /tmp/qic-ci-r3-auth.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/qic-r3-postgres/data/postmaster.pid ]; then
            pg_ctl -D /tmp/qic-r3-postgres/data -m fast -w stop
          fi
          rm -f /tmp/qic-r3-magic-link.json
          rm -rf .next-r3-auth
      - name: Remove Reading local QA fixture
        if: always()
        run: node scripts/ritual-qa-fixture.mjs remove

