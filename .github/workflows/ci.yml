name: ci

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iching_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AI_ADAPTER_MODE: local
      AUTH_ADAPTER_MODE: dev
      PAYMENT_ADAPTER_MODE: simulated
      DATABASE_ADAPTER_MODE: memory
      WORKFLOW_ADAPTER_MODE: local
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/iching_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Build credential-free application
        id: production-build
        shell: bash
        run: |
          set +e
          NODE_OPTIONS="--enable-source-maps --trace-uncaught" bun run build 2>&1 | tee workflow-build.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Workflow build diagnostics
        if: steps.production-build.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-build-diagnostics
          if-no-files-found: warn
          retention-days: 3
          path: |
            workflow-build.log
            src/app/.well-known/workflow/**
            .next/server/chunks/**
            .next/server/app/.well-known/workflow/**
      - name: Enforce production build
        if: steps.production-build.outputs.status != '0'
        run: exit 1
