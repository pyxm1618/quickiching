name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/three-issue-frontend-convergence, fix/ci-architecture-remediation]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: CI / Select gates
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      risk_class: ${{ steps.select.outputs.risk_class }}
      high_risk: ${{ steps.select.outputs.high_risk }}
      runtime: ${{ steps.select.outputs.runtime }}
      ci_contract: ${{ steps.select.outputs.ci_contract }}
      build: ${{ steps.select.outputs.build }}
      schema: ${{ steps.select.outputs.schema }}
      database: ${{ steps.select.outputs.database }}
      reading: ${{ steps.select.outputs.reading }}
      reading_lifecycle: ${{ steps.select.outputs.reading_lifecycle }}
      seo_static: ${{ steps.select.outputs.seo_static }}
      seo_browser: ${{ steps.select.outputs.seo_browser }}
      locale_browser: ${{ steps.select.outputs.locale_browser }}
      public_seo: ${{ steps.select.outputs.public_seo }}
      navigation: ${{ steps.select.outputs.navigation }}
      auth_lifecycle: ${{ steps.select.outputs.auth_lifecycle }}
      account_info: ${{ steps.select.outputs.account_info }}
      payment_refund: ${{ steps.select.outputs.payment_refund }}
      payment: ${{ steps.select.outputs.payment }}
      hexagram_detail: ${{ steps.select.outputs.hexagram_detail }}
      security: ${{ steps.select.outputs.security }}
      performance: ${{ steps.select.outputs.performance }}
      performance_targets: ${{ steps.select.outputs.performance_targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select affected CI domains
        id: select
        env:
          CI_FORCE_FULL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CI_FORCE_FULL" = "1" ]; then
            printf '' | node scripts/ci/select-gates.mjs
          else
            git diff --name-only "$CI_BASE_SHA...$CI_HEAD_SHA" | node scripts/ci/select-gates.mjs
          fi

  fast:
    name: CI / Fast
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Diff hygiene
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CI_BASE_SHA:-}" ] && [ "${CI_BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$CI_BASE_SHA...$CI_HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: CI architecture contract
        run: node --test scripts/ci/*.test.mjs
      - name: Secret diff scan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/secret-scan.mjs
      - uses: oven-sh/setup-bun@v2
        if: needs.select.outputs.runtime == 'true'
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        if: needs.select.outputs.runtime == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        if: needs.select.outputs.runtime == 'true'
        run: bun install --frozen-lockfile
      - name: Lint
        if: needs.select.outputs.runtime == 'true'
        run: bun run lint
      - name: Typecheck
        if: needs.select.outputs.runtime == 'true'
        run: bun run typecheck
      - name: Full unit suite
        if: needs.select.outputs.runtime == 'true'
        run: bun run test

  build:
    name: CI / Build
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-22.23.2-bun-1.3.14-next-15.5.25-default-${{ hashFiles('bun.lock', 'next.config.mjs', 'tsconfig.json') }}
      - name: Production build
        run: bun run build

  schema:
    name: CI / Schema
    needs: select
    if: needs.select.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Migration integrity
        run: node scripts/check-migration-integrity.mjs
      - name: Drizzle metadata check
        run: bunx drizzle-kit check

  core_compat:
    name: CI / Core
    if: always()
    needs: [select, fast, build, schema]
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility aggregate only
        shell: bash
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCHEMA_RESULT: ${{ needs.schema.result }}
          BUILD_SELECTED: ${{ needs.select.outputs.build }}
          SCHEMA_SELECTED: ${{ needs.select.outputs.schema }}
        run: |
          set -euo pipefail
          test "$SELECT_RESULT" = success
          test "$FAST_RESULT" = success
          if [ "$BUILD_SELECTED" = true ]; then test "$BUILD_RESULT" = success; else test "$BUILD_RESULT" = skipped -o "$BUILD_RESULT" = success; fi
          if [ "$SCHEMA_SELECTED" = true ]; then test "$SCHEMA_RESULT" = success; else test "$SCHEMA_RESULT" = skipped -o "$SCHEMA_RESULT" = success; fi

  database:
    name: CI / Database
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Gate selection
        run: echo "database=${{ needs.select.outputs.database }} full=${{ needs.select.outputs.full }}"
      - uses: actions/checkout@v6
        if: needs.select.outputs.database == 'true'
      - uses: actions/setup-node@v6
        if: needs.select.outputs.database == 'true'
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        if: needs.select.outputs.database == 'true'
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        if: needs.select.outputs.database == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install PostgreSQL tools
        if: needs.select.outputs.database == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        if: needs.select.outputs.database == 'true'
        run: bun install --frozen-lockfile
      - name: Current migration chain + PostgreSQL integration
        if: needs.select.outputs.database == 'true'
        run: node scripts/test-postgres-serial.mjs

  reading:
    name: CI / Reading
    needs: select
    if: needs.select.outputs.reading == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Reading local QA fixture
        run: node scripts/ritual-qa-fixture.mjs install
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-22.23.2-bun-1.3.14-next-15.5.25-default-${{ hashFiles('bun.lock', 'next.config.mjs', 'tsconfig.json') }}
      - name: Production build
        run: bun run build
      - name: Install pinned browser tools
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('config/performance-gates.json','utf8')).tooling;
          console.log('LIGHTHOUSE_VERSION='+t.lighthouse);
          console.log('PUPPETEER_VERSION='+t.puppeteerCore);
          console.log('CHROMIUM_VERSION='+t.chromium);
          NODE
          )"
          bun add --no-save --cache-dir=/tmp/quickiching-ci-browser-cache "puppeteer-core@$PUPPETEER_VERSION" "@sparticuz/chromium@$CHROMIUM_VERSION" "lighthouse@$LIGHTHOUSE_VERSION"
          CHROME_PATH="$(node -e 'import("@sparticuz/chromium").then(async m=>process.stdout.write(await m.default.executablePath()))')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Start Reading production server
        shell: bash
        run: |
          set -euo pipefail
          (RITUAL_VISUAL_QA=1 RITUAL_QA_HOST=127.0.0.1:3036 PORT=3036 HOSTNAME=127.0.0.1 CHINESE_INTERACTIVE_GATE_PRICING_PREVIEW=1 bun run start > /tmp/qic-ci-reading.log 2>&1 & echo $! > /tmp/qic-ci-reading.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-reading.log
          exit 1
      - name: Reading / Casting UI
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          READING_TEST_BASE_URL: http://127.0.0.1:3036
          READING_VISUAL_OUTPUT: .artifacts/pricing-purchase-ui
        shell: bash
        run: |
          set -euo pipefail
          node scripts/manual-cast-ui-browser-gate.mjs
          node scripts/three-coin-v2-browser-gate.mjs
          node scripts/ritual-scene-boundary-gate.mjs --case=six-lines-auth
          node scripts/ritual-scene-boundary-gate.mjs --case=six-lines-auth-zh-reduced
          bun scripts/mei-hua-ui-browser-gate.mjs
      - name: Reading / Public and Purchase Integration
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          READING_TEST_BASE_URL: http://127.0.0.1:3036
          READING_VISUAL_OUTPUT: .artifacts/pricing-purchase-ui
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reading-business-browser.mjs
          bun scripts/public-p0-browser-gate.mjs
      - name: Upload Pricing / purchase visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-purchase-ui-visual-evidence
          path: .artifacts/pricing-purchase-ui
          if-no-files-found: error
          retention-days: 3
      - name: Upload Manual Cast visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-cast-ui-visual-evidence
          path: .artifacts/manual-cast-ui
          if-no-files-found: warn
          retention-days: 3
      - name: Stop Reading server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qic-ci-reading.pid ]; then kill "$(cat /tmp/qic-ci-reading.pid)" 2>/dev/null || true; fi
      - name: Remove Reading local QA fixture
        if: always()
        run: node scripts/ritual-qa-fixture.mjs remove

  reading_lifecycle:
    name: CI / Reading Lifecycle
    needs: select
    if: needs.select.outputs.reading_lifecycle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Reading local QA fixture
        run: node scripts/ritual-qa-fixture.mjs install
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-22.23.2-bun-1.3.14-next-15.5.25-default-${{ hashFiles('bun.lock', 'next.config.mjs', 'tsconfig.json') }}
      - name: Production build
        run: bun run build
      - name: Install pinned browser tools
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('config/performance-gates.json','utf8')).tooling;
          console.log('PUPPETEER_VERSION='+t.puppeteerCore);
          console.log('CHROMIUM_VERSION='+t.chromium);
          NODE
          )"
          bun add --no-save --cache-dir=/tmp/quickiching-ci-browser-cache "puppeteer-core@$PUPPETEER_VERSION" "@sparticuz/chromium@$CHROMIUM_VERSION"
          CHROME_PATH="$(node -e 'import("@sparticuz/chromium").then(async m=>process.stdout.write(await m.default.executablePath()))')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start Reading lifecycle server
        shell: bash
        run: |
          (RITUAL_VISUAL_QA=1 RITUAL_QA_HOST=127.0.0.1:3036 PORT=3036 HOSTNAME=127.0.0.1 bun run start > /tmp/qic-ci-reading-lifecycle.log 2>&1 & echo $! > /tmp/qic-ci-reading-lifecycle.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-reading-lifecycle.log
          exit 1
      - name: Reading / Lifecycle
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          READING_TEST_BASE_URL: http://127.0.0.1:3036
        run: node scripts/reading-lifecycle-browser-gate.mjs
      - name: Stop Reading lifecycle server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qic-ci-reading-lifecycle.pid ]; then kill "$(cat /tmp/qic-ci-reading-lifecycle.pid)" 2>/dev/null || true; fi
      - name: Remove Reading local QA fixture
        if: always()
        run: node scripts/ritual-qa-fixture.mjs remove

  seo_static:
    name: CI / SEO Static
    needs: select
    if: needs.select.outputs.seo_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: SEO static contracts
        shell: bash
        run: |
          set -euo pipefail
          bun run seo:registry
          bun run seo:quality
          bun scripts/interpretation-bundle-gate.mjs

  public_seo_browser:
    name: CI / Public SEO
    needs: select
    if: needs.select.outputs.seo_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-22.23.2-bun-1.3.14-next-15.5.25-default-${{ hashFiles('bun.lock', 'next.config.mjs', 'tsconfig.json') }}
      - name: Production build
        run: bun run build
      - name: Install pinned browser tools
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('config/performance-gates.json','utf8')).tooling;
          console.log('LIGHTHOUSE_VERSION='+t.lighthouse);
          console.log('PUPPETEER_VERSION='+t.puppeteerCore);
          console.log('CHROMIUM_VERSION='+t.chromium);
          NODE
          )"
          bun add --no-save --cache-dir=/tmp/quickiching-ci-browser-cache "puppeteer-core@$PUPPETEER_VERSION" "@sparticuz/chromium@$CHROMIUM_VERSION" "lighthouse@$LIGHTHOUSE_VERSION"
          CHROME_PATH="$(node -e 'import("@sparticuz/chromium").then(async m=>process.stdout.write(await m.default.executablePath()))')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start Public SEO server
        shell: bash
        run: |
          (PORT=3036 HOSTNAME=127.0.0.1 CHINESE_INTERACTIVE_GATE_PRICING_PREVIEW=1 bun run start > /tmp/qic-ci-public-seo.log 2>&1 & echo $! > /tmp/qic-ci-public-seo.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-public-seo.log
          exit 1
      - name: SEO browser contracts
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          HEXAGRAM_SEO_AUDIT_BASE_URL: http://127.0.0.1:3036
          HEXAGRAM_SEO_BROWSER_BASE_URL: http://127.0.0.1:3036
        shell: bash
        run: |
          set -euo pipefail
          bun run seo:browser
          bun scripts/browser-gate.mjs
          bun scripts/on-page-seo-browser-gate.mjs
          bun scripts/logo-browser-gate.mjs
      - name: Stop Public SEO server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qic-ci-public-seo.pid ]; then kill "$(cat /tmp/qic-ci-public-seo.pid)" 2>/dev/null || true; fi

  locale_browser:
    name: CI / Locale Browser
    needs: select
    if: needs.select.outputs.locale_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-22.23.2-bun-1.3.14-next-15.5.25-default-${{ hashFiles('bun.lock', 'next.config.mjs', 'tsconfig.json') }}
      - name: Production build
        run: bun run build
      - name: Install pinned browser tools
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('config/performance-gates.json','utf8')).tooling;
          console.log('PUPPETEER_VERSION='+t.puppeteerCore);
          console.log('CHROMIUM_VERSION='+t.chromium);
          NODE
          )"
          bun add --no-save --cache-dir=/tmp/quickiching-ci-browser-cache "puppeteer-core@$PUPPETEER_VERSION" "@sparticuz/chromium@$CHROMIUM_VERSION"
          CHROME_PATH="$(node -e 'import("@sparticuz/chromium").then(async m=>process.stdout.write(await m.default.executablePath()))')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start Locale server
        shell: bash
        run: |
          (PORT=3036 HOSTNAME=127.0.0.1 CHINESE_INTERACTIVE_GATE_PRICING_PREVIEW=1 bun run start > /tmp/qic-ci-locale.log 2>&1 & echo $! > /tmp/qic-ci-locale.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-locale.log
          exit 1
      - name: Locale browser contracts
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          CHINESE_SEO_AUDIT_BASE_URL: http://127.0.0.1:3036
          CHINESE_INTERACTIVE_GATE_BASE_URL: http://127.0.0.1:3036
          MULTILINGUAL_TEST_BASE_URL: http://127.0.0.1:3036
        shell: bash
        run: |
          set -euo pipefail
          bun run seo:zh
          bun run gate:interactive:zh
          bun scripts/multilingual-browser-gate.mjs
      - name: Stop Locale server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qic-ci-locale.pid ]; then kill "$(cat /tmp/qic-ci-locale.pid)" 2>/dev/null || true; fi

  navigation:
    name: CI / Navigation
    needs: select
    if: needs.select.outputs.navigation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node-22.23.2-bun-1.3.14-next-15.5.25-default-${{ hashFiles('bun.lock', 'next.config.mjs', 'tsconfig.json') }}
      - name: Production build
        run: bun run build
      - name: Install pinned browser tools
        shell: bash
