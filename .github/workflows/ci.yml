name: ci

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iching_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AI_ADAPTER_MODE: local
      AUTH_ADAPTER_MODE: dev
      PAYMENT_ADAPTER_MODE: simulated
      DATABASE_ADAPTER_MODE: memory
      WORKFLOW_ADAPTER_MODE: local
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/iching_test
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/iching_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test --reporter=dot
      - run: bun run build

  browser-e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AI_ADAPTER_MODE: local
      AUTH_ADAPTER_MODE: dev
      NEXT_PUBLIC_AUTH_ADAPTER_MODE: dev
      PAYMENT_ADAPTER_MODE: simulated
      DATABASE_ADAPTER_MODE: memory
      WORKFLOW_ADAPTER_MODE: local
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_HOME: /tmp/iching-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install pinned Playwright in isolation
        run: |
          mkdir -p "$PLAYWRIGHT_HOME"
          npm install \
            --prefix "$PLAYWRIGHT_HOME" \
            --no-save \
            --package-lock=false \
            --legacy-peer-deps \
            @playwright/test@1.62.0
          mkdir -p node_modules/@playwright
          ln -s "$PLAYWRIGHT_HOME/node_modules/@playwright/test" node_modules/@playwright/test
          ln -s "$PLAYWRIGHT_HOME/node_modules/playwright" node_modules/playwright
          ln -s "$PLAYWRIGHT_HOME/node_modules/playwright-core" node_modules/playwright-core
      - name: Install Chromium
        run: "$PLAYWRIGHT_HOME/node_modules/.bin/playwright install --with-deps chromium"
      - name: Start application
        run: |
          bun run dev --hostname 127.0.0.1 > /tmp/iching-e2e-server.log 2>&1 &
          echo $! > /tmp/iching-e2e-server.pid
      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iching-e2e-server.log
          exit 1
      - name: Run browser E2E
        run: "$PLAYWRIGHT_HOME/node_modules/.bin/playwright test"
      - name: Print application log on failure
        if: failure()
        run: cat /tmp/iching-e2e-server.log
