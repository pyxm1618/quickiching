name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/three-issue-frontend-convergence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: CI / Select gates
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      risk_class: ${{ steps.select.outputs.risk_class }}
      high_risk: ${{ steps.select.outputs.high_risk }}
      runtime: ${{ steps.select.outputs.runtime }}
      ci_contract: ${{ steps.select.outputs.ci_contract }}
      build: ${{ steps.select.outputs.build }}
      schema: ${{ steps.select.outputs.schema }}
      database: ${{ steps.select.outputs.database }}
      reading: ${{ steps.select.outputs.reading }}
      seo_static: ${{ steps.select.outputs.seo_static }}
      seo_browser: ${{ steps.select.outputs.seo_browser }}
      locale_browser: ${{ steps.select.outputs.locale_browser }}
      public_seo: ${{ steps.select.outputs.public_seo }}
      navigation: ${{ steps.select.outputs.navigation }}
      auth_lifecycle: ${{ steps.select.outputs.auth_lifecycle }}
      account_info: ${{ steps.select.outputs.account_info }}
      payment_refund: ${{ steps.select.outputs.payment_refund }}
      payment: ${{ steps.select.outputs.payment }}
      hexagram_detail: ${{ steps.select.outputs.hexagram_detail }}
      security: ${{ steps.select.outputs.security }}
      performance: ${{ steps.select.outputs.performance }}
      performance_targets: ${{ steps.select.outputs.performance_targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select affected CI domains
        id: select
        env:
          CI_FORCE_FULL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CI_FORCE_FULL" = "1" ]; then
            printf '' | node scripts/ci/select-gates.mjs
          else
            git diff --name-only "$CI_BASE_SHA...$CI_HEAD_SHA" | node scripts/ci/select-gates.mjs
          fi

  fast:
    name: CI / Fast
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Diff hygiene
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CI_BASE_SHA:-}" ] && [ "${CI_BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$CI_BASE_SHA...$CI_HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: CI architecture contract
        run: node --test scripts/ci/*.test.mjs
      - name: Secret diff scan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/secret-scan.mjs
      - uses: oven-sh/setup-bun@v2
        if: needs.select.outputs.runtime == 'true'
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        if: needs.select.outputs.runtime == 'true'
        run: bun install --frozen-lockfile
      - name: Lint
        if: needs.select.outputs.runtime == 'true'
        run: bun run lint
      - name: Typecheck
        if: needs.select.outputs.runtime == 'true'
        run: bun run typecheck
      - name: Full unit suite
        if: needs.select.outputs.runtime == 'true'
        run: bun run test

  build:
    name: CI / Build
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build

  schema:
    name: CI / Schema
    needs: select
    if: needs.select.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Migration integrity
        run: node scripts/check-migration-integrity.mjs
      - name: Drizzle metadata check
        run: bunx drizzle-kit check

  core_compat:
    name: CI / Core
    if: always()
    needs: [select, fast, build, schema]
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility aggregate only
        shell: bash
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCHEMA_RESULT: ${{ needs.schema.result }}
          BUILD_SELECTED: ${{ needs.select.outputs.build }}
          SCHEMA_SELECTED: ${{ needs.select.outputs.schema }}
        run: |
          set -euo pipefail
          test "$SELECT_RESULT" = success
          test "$FAST_RESULT" = success
          if [ "$BUILD_SELECTED" = true ]; then test "$BUILD_RESULT" = success; else test "$BUILD_RESULT" = skipped -o "$BUILD_RESULT" = success; fi
          if [ "$SCHEMA_SELECTED" = true ]; then test "$SCHEMA_RESULT" = success; else test "$SCHEMA_RESULT" = skipped -o "$SCHEMA_RESULT" = success; fi

  database:
    name: CI / Database
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Gate selection
        run: echo "database=${{ needs.select.outputs.database }} full=${{ needs.select.outputs.full }}"
      - uses: actions/checkout@v6
        if: needs.select.outputs.database == 'true'
      - uses: actions/setup-node@v6
        if: needs.select.outputs.database == 'true'
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        if: needs.select.outputs.database == 'true'
        with:
          bun-version: 1.3.14
      - name: Install PostgreSQL tools
        if: needs.select.outputs.database == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        if: needs.select.outputs.database == 'true'
        run: bun install --frozen-lockfile
      - name: Current migration chain + PostgreSQL integration
        if: needs.select.outputs.database == 'true'
        run: node scripts/test-postgres-serial.mjs

  product:
    name: CI / Product
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCT_SELECTED: ${{ needs.select.outputs.reading == 'true' || needs.select.outputs.public_seo == 'true' || needs.select.outputs.account_info == 'true' || needs.select.outputs.payment == 'true' || needs.select.outputs.hexagram_detail == 'true' }}
    steps:
      - name: Gate selection
        run: |
          echo "reading=${{ needs.select.outputs.reading }}"
          echo "public_seo=${{ needs.select.outputs.public_seo }}"
          echo "account_info=${{ needs.select.outputs.account_info }}"
          echo "payment=${{ needs.select.outputs.payment }}"
          echo "hexagram_detail=${{ needs.select.outputs.hexagram_detail }}"
      - uses: actions/checkout@v6
        if: env.PRODUCT_SELECTED == 'true'
        with:
          fetch-depth: 0
      - name: Verify product exact-head checkout
        if: env.PRODUCT_SELECTED == 'true' && github.event_name == 'push' && github.ref_name == 'fix/three-issue-frontend-convergence'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected exact head: $EXPECTED_SHA"
          echo "Actual checked-out SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v6
        if: env.PRODUCT_SELECTED == 'true'
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        if: env.PRODUCT_SELECTED == 'true'
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        if: env.PRODUCT_SELECTED == 'true'
        run: bun install --frozen-lockfile
      - name: Install Account local QA fixture
        if: needs.select.outputs.account_info == 'true'
        run: node scripts/group3-visual-qa-fixture.mjs install
      - name: Install Reading local QA fixture
        if: needs.select.outputs.reading == 'true'
        run: node scripts/ritual-qa-fixture.mjs install
      - name: Production build for browser domains
        id: product_build
        if: needs.select.outputs.reading == 'true' || needs.select.outputs.public_seo == 'true' || needs.select.outputs.account_info == 'true' || needs.select.outputs.hexagram_detail == 'true'
        run: bun run build
      - name: Install pinned browser tools
        if: needs.select.outputs.reading == 'true' || needs.select.outputs.public_seo == 'true' || needs.select.outputs.account_info == 'true' || needs.select.outputs.hexagram_detail == 'true'
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('config/performance-gates.json','utf8')).tooling;
          console.log('LIGHTHOUSE_VERSION='+c.lighthouse);
          console.log('PUPPETEER_VERSION='+c.puppeteerCore);
          console.log('CHROMIUM_VERSION='+c.chromium);
          NODE
          )"
          bun add --no-save --cache-dir=/tmp/quickiching-ci-browser-cache             "puppeteer-core@$PUPPETEER_VERSION" "@sparticuz/chromium@$CHROMIUM_VERSION" "lighthouse@$LIGHTHOUSE_VERSION"
          CHROME_PATH="$(node -e 'import("@sparticuz/chromium").then(async m=>process.stdout.write(await m.default.executablePath()))')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Start production server
        if: needs.select.outputs.reading == 'true' || needs.select.outputs.public_seo == 'true' || needs.select.outputs.account_info == 'true' || needs.select.outputs.hexagram_detail == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (GROUP3_VISUAL_QA=1 RITUAL_VISUAL_QA=1 RITUAL_QA_HOST=127.0.0.1:3036 PORT=3036 HOSTNAME=127.0.0.1 CHINESE_INTERACTIVE_GATE_PRICING_PREVIEW=1 bun run start > /tmp/qic-ci-product.log 2>&1 & echo $! > /tmp/qic-ci-product.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-product.log
          exit 1
      - name: Reading Gate
        if: always() && needs.select.outputs.reading == 'true' && steps.product_build.conclusion == 'success'
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          READING_TEST_BASE_URL: http://127.0.0.1:3036
          READING_VISUAL_OUTPUT: .artifacts/pricing-purchase-ui
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reading-business-browser.mjs
          node scripts/manual-cast-ui-browser-gate.mjs
          node scripts/three-coin-v2-browser-gate.mjs
          node scripts/ritual-scene-boundary-gate.mjs --case=six-lines-auth
          node scripts/ritual-scene-boundary-gate.mjs --case=six-lines-auth-zh-reduced
          bun scripts/mei-hua-ui-browser-gate.mjs
          bun scripts/public-p0-browser-gate.mjs
          node scripts/reading-lifecycle-browser-gate.mjs
      - name: Upload Pricing / purchase visual evidence
        if: always() && needs.select.outputs.reading == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pricing-purchase-ui-visual-evidence
          path: .artifacts/pricing-purchase-ui
          if-no-files-found: error
          retention-days: 3
      - name: Upload Manual Cast visual evidence
        if: always() && needs.select.outputs.reading == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manual-cast-ui-visual-evidence
          path: .artifacts/manual-cast-ui
          if-no-files-found: warn
          retention-days: 3
      - name: Public / SEO Gate
        if: always() && needs.select.outputs.public_seo == 'true' && steps.product_build.conclusion == 'success'
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          HEXAGRAM_SEO_AUDIT_BASE_URL: http://127.0.0.1:3036
          HEXAGRAM_SEO_BROWSER_BASE_URL: http://127.0.0.1:3036
          CHINESE_SEO_AUDIT_BASE_URL: http://127.0.0.1:3036
          CHINESE_INTERACTIVE_GATE_BASE_URL: http://127.0.0.1:3036
          MULTILINGUAL_TEST_BASE_URL: http://127.0.0.1:3036
        shell: bash
        run: |
          set -euo pipefail
          bun run seo:registry
          bun run seo:quality
          bun run seo:browser
          bun run seo:zh
          bun run gate:interactive:zh
          bun scripts/browser-gate.mjs
          bun scripts/on-page-seo-browser-gate.mjs
          bun scripts/multilingual-browser-gate.mjs
          bun scripts/interpretation-bundle-gate.mjs
          bun scripts/logo-browser-gate.mjs
          bun run gate:navigation
      - name: Prepare PostgreSQL for real auth browser gates
        if: always() && (needs.select.outputs.reading == 'true' || needs.select.outputs.public_seo == 'true') && steps.product_build.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          PG_BINDIR="$(pg_config --bindir)"
          export PATH="$PG_BINDIR:$PATH"
          echo "$PG_BINDIR" >> "$GITHUB_PATH"
          rm -rf /tmp/qic-r3-postgres
          mkdir -p /tmp/qic-r3-postgres/socket
          initdb -D /tmp/qic-r3-postgres/data -A trust -U quickiching_r3 --no-locale --encoding=UTF8
          pg_ctl -D /tmp/qic-r3-postgres/data -o "-p 55432 -k /tmp/qic-r3-postgres/socket" -w start
          createdb -h 127.0.0.1 -p 55432 -U quickiching_r3 quickiching_r3
          R3_AUTH_DATABASE_URL="postgresql://quickiching_r3@127.0.0.1:55432/quickiching_r3"
          MIGRATION_DATABASE_URL="$R3_AUTH_DATABASE_URL" DATABASE_URL="$R3_AUTH_DATABASE_URL" bun run db:migrate
          echo "R3_AUTH_DATABASE_URL=$R3_AUTH_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Start auth-surface server for nested navigation context
        if: always() && (needs.select.outputs.reading == 'true' || needs.select.outputs.public_seo == 'true') && steps.product_build.conclusion == 'success'
        shell: bash
        env:
          COMMERCIAL_V2_AUTH_ENABLED: "1"
          AUTH_ADAPTER_MODE: better-auth
          DATABASE_ADAPTER_MODE: postgres
          QUESTION_FINGERPRINT_KEYS: v1:ci-question-fingerprint-key-material-001
          QUESTION_ENCRYPTION_KEYS: v1:ci-question-encryption-key-material-002
          RESULT_INTEGRITY_KEYS: v1:ci-result-integrity-key-material-003
          ANONYMOUS_OWNER_KEYS: v1:ci-anonymous-owner-key-material-004
          BETTER_AUTH_SECRET: ci-better-auth-secret-material-0123456789ab
          BETTER_AUTH_URL: http://127.0.0.1:3037
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          RESEND_API_KEY: ci-resend-api-key
          EMAIL_FROM: ci@quickiching.test
          AUTH_BROWSER_FIXTURE: "1"
          AUTH_MAGIC_LINK_CAPTURE_FILE: /tmp/qic-r3-magic-link.json
        run: |
          set -euo pipefail
          export DATABASE_URL="$R3_AUTH_DATABASE_URL"
          rm -f /tmp/qic-r3-magic-link.json
          (PORT=3037 HOSTNAME=127.0.0.1 bun run start > /tmp/qic-ci-auth-surface.log 2>&1 & echo $! > /tmp/qic-ci-auth-surface.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3037/signin >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-auth-surface.log
          exit 1
      - name: Navigation Context / Locale Continuation Gate (R2)
        if: always() && (needs.select.outputs.reading == 'true' || needs.select.outputs.public_seo == 'true') && steps.product_build.conclusion == 'success'
        env:
          NAV_CONTEXT_TEST_BASE_URL: http://127.0.0.1:3036
          NAV_CONTEXT_AUTH_BASE_URL: http://127.0.0.1:3037
        shell: bash
        run: |
          set -euo pipefail
          node scripts/navigation-context-browser-gate.mjs
      - name: Build isolated R3 auth-enabled production bundle
        if: always() && needs.select.outputs.reading == 'true' && steps.product_build.conclusion == 'success'
        shell: bash
        env:
          COMMERCIAL_V2_AUTH_ENABLED: "1"
          AUTH_ADAPTER_MODE: better-auth
          DATABASE_ADAPTER_MODE: postgres
          QUESTION_FINGERPRINT_KEYS: v1:ci-question-fingerprint-key-material-001
          QUESTION_ENCRYPTION_KEYS: v1:ci-question-encryption-key-material-002
          RESULT_INTEGRITY_KEYS: v1:ci-result-integrity-key-material-003
          ANONYMOUS_OWNER_KEYS: v1:ci-anonymous-owner-key-material-004
          BETTER_AUTH_SECRET: ci-better-auth-secret-material-0123456789ab
          BETTER_AUTH_URL: http://127.0.0.1:3038
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          RESEND_API_KEY: ci-resend-api-key
          EMAIL_FROM: ci@quickiching.test
          AUTH_BROWSER_FIXTURE: "1"
          AUTH_MAGIC_LINK_CAPTURE_FILE: /tmp/qic-r3-magic-link.json
          QIC_NEXT_DIST_DIR: .next-r3-auth
        run: |
          set -euo pipefail
          export DATABASE_URL="$R3_AUTH_DATABASE_URL"
          rm -rf .next-r3-auth
          bun run build

      - name: Start isolated R3 auth-enabled production runtime
        if: always() && needs.select.outputs.reading == 'true' && steps.product_build.conclusion == 'success'
        shell: bash
        env:
          COMMERCIAL_V2_AUTH_ENABLED: "1"
          AUTH_ADAPTER_MODE: better-auth
          DATABASE_ADAPTER_MODE: postgres
          QUESTION_FINGERPRINT_KEYS: v1:ci-question-fingerprint-key-material-001
          QUESTION_ENCRYPTION_KEYS: v1:ci-question-encryption-key-material-002
          RESULT_INTEGRITY_KEYS: v1:ci-result-integrity-key-material-003
          ANONYMOUS_OWNER_KEYS: v1:ci-anonymous-owner-key-material-004
          BETTER_AUTH_SECRET: ci-better-auth-secret-material-0123456789ab
          BETTER_AUTH_URL: http://127.0.0.1:3038
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          RESEND_API_KEY: ci-resend-api-key
          EMAIL_FROM: ci@quickiching.test
          AUTH_BROWSER_FIXTURE: "1"
          AUTH_MAGIC_LINK_CAPTURE_FILE: /tmp/qic-r3-magic-link.json
          QIC_NEXT_DIST_DIR: .next-r3-auth
        run: |
          set -euo pipefail
          export DATABASE_URL="$R3_AUTH_DATABASE_URL"
          rm -f /tmp/qic-r3-magic-link.json
          (PORT=3038 HOSTNAME=127.0.0.1 bun run start > /tmp/qic-ci-r3-auth.log 2>&1 & echo $! > /tmp/qic-ci-r3-auth.pid)
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:3038/signin >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-r3-auth.log
          exit 1

      - name: Reading Lifecycle Final Browser Gate (R3)
        if: always() && needs.select.outputs.reading == 'true' && steps.product_build.conclusion == 'success'
        env:
          READING_FINAL_AUTH_BASE_URL: http://127.0.0.1:3038
          R3_MAGIC_LINK_CAPTURE_FILE: /tmp/qic-r3-magic-link.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reading-lifecycle-final-browser-gate.mjs
      - name: Hexagram Detail structural browser Gate
        if: always() && needs.select.outputs.hexagram_detail == 'true' && steps.product_build.conclusion == 'success'
        env:
          HEXAGRAM_DETAIL_UI_BASE_URL: http://127.0.0.1:3036
        run: bun scripts/hexagram-detail-ui-browser.mjs
      - name: Account / Info browser + responsive Gate
        if: always() && needs.select.outputs.account_info == 'true' && steps.product_build.conclusion == 'success'
        env:
          GROUP3_QA_BASE_URL: http://127.0.0.1:3036
        run: node scripts/group3-visual-capture.mjs .artifacts/account-info-evidence
      - name: Navigation Shell / reactive context browser Gate
        if: always() && steps.product_build.conclusion == 'success'
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
        run: node scripts/navigation-shell-browser-gate.mjs
      - name: Payment Gate - dependency regression audit
        if: always() && needs.select.outputs.payment == 'true'
        run: node scripts/ci/dependency-audit-gate.mjs
      - name: Payment Gate - plaintext secret scan
        if: always() && needs.select.outputs.payment == 'true'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/secret-scan.mjs
      - name: Upload Account / Info manual visual evidence
        if: always() && needs.select.outputs.account_info == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: account-info-manual-visual-evidence
          path: .artifacts/account-info-evidence
          if-no-files-found: warn
          retention-days: 3
      - name: Stop production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qic-ci-product.pid ]; then kill "$(cat /tmp/qic-ci-product.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/qic-ci-auth-surface.pid ]; then kill "$(cat /tmp/qic-ci-auth-surface.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/qic-ci-r3-auth.pid ]; then kill "$(cat /tmp/qic-ci-r3-auth.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/qic-r3-postgres/data/postmaster.pid ]; then
            pg_ctl -D /tmp/qic-r3-postgres/data -m fast -w stop
          fi
          rm -f /tmp/qic-r3-magic-link.json
          rm -rf .next-r3-auth
      - name: Remove Account local QA fixture
        if: always() && needs.select.outputs.account_info == 'true'
        run: node scripts/group3-visual-qa-fixture.mjs remove
      - name: Remove Reading local QA fixture
        if: always() && needs.select.outputs.reading == 'true'
        run: node scripts/ritual-qa-fixture.mjs remove

  performance:
    name: CI / Performance
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Gate selection
        run: echo 'targets=${{ needs.select.outputs.performance_targets }}'
      - uses: actions/checkout@v6
        if: needs.select.outputs.performance == 'true'
      - uses: actions/setup-node@v6
        if: needs.select.outputs.performance == 'true'
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        if: needs.select.outputs.performance == 'true'
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        if: needs.select.outputs.performance == 'true'
        run: bun install --frozen-lockfile
      - name: Install Account performance fixture when selected
        if: needs.select.outputs.performance == 'true' && contains(needs.select.outputs.performance_targets, 'account.desktop')
        run: node scripts/group3-visual-qa-fixture.mjs install
      - name: Production build
        if: needs.select.outputs.performance == 'true'
        run: bun run build
      - name: Stable asset and bundle budgets
        if: needs.select.outputs.performance == 'true'
        run: node scripts/performance-asset-gate.mjs
      - name: Install pinned Lighthouse browser stack
        if: needs.select.outputs.performance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          eval "$(node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('config/performance-gates.json','utf8')).tooling;
          console.log('LIGHTHOUSE_VERSION='+c.lighthouse);
          console.log('PUPPETEER_VERSION='+c.puppeteerCore);
          console.log('CHROMIUM_VERSION='+c.chromium);
          NODE
          )"
          bun add --no-save --cache-dir=/tmp/quickiching-ci-lighthouse-cache             "puppeteer-core@$PUPPETEER_VERSION" "@sparticuz/chromium@$CHROMIUM_VERSION" "lighthouse@$LIGHTHOUSE_VERSION"
          CHROME_PATH="$(node -e 'import("@sparticuz/chromium").then(async m=>process.stdout.write(await m.default.executablePath()))')"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Start performance server
        if: needs.select.outputs.performance == 'true'
        shell: bash
        run: |
          (GROUP3_VISUAL_QA=1 PORT=3036 HOSTNAME=127.0.0.1 bun run start > /tmp/qic-ci-performance.log 2>&1 & echo $! > /tmp/qic-ci-performance.pid)
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3036/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qic-ci-performance.log
          exit 1
      - name: Targeted Lighthouse
        if: needs.select.outputs.performance == 'true'
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3036
          CI_PERFORMANCE_TARGETS: ${{ needs.select.outputs.performance_targets }}
        run: node scripts/ci/lighthouse-gate.mjs
      - name: Upload Lighthouse evidence
        if: always() && needs.select.outputs.performance == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-lighthouse-evidence
          path: .artifacts/ci-lighthouse
          if-no-files-found: warn
          retention-days: 3
      - name: Stop performance server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/qic-ci-performance.pid ]; then kill "$(cat /tmp/qic-ci-performance.pid)" 2>/dev/null || true; fi
      - name: Remove Account performance fixture
        if: always() && needs.select.outputs.performance == 'true' && contains(needs.select.outputs.performance_targets, 'account.desktop')
        run: node scripts/group3-visual-qa-fixture.mjs remove

  required:
    name: CI / Required
    if: always()
    needs: [select, fast, build, schema, core_compat, database, product, performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce required gate results
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          CORE_RESULT: ${{ needs.core_compat.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          PRODUCT_RESULT: ${{ needs.product.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          DATABASE_SELECTED: ${{ needs.select.outputs.database }}
          PRODUCT_SELECTED: ${{ needs.select.outputs.reading == 'true' || needs.select.outputs.public_seo == 'true' || needs.select.outputs.account_info == 'true' || needs.select.outputs.payment == 'true' || needs.select.outputs.hexagram_detail == 'true' }}
          PERFORMANCE_SELECTED: ${{ needs.select.outputs.performance }}
        run: node scripts/ci/required-gate.mjs
