  product_compat:
    name: CI / Product
    if: always()
    needs: [select, reading, reading_lifecycle, seo_static, public_seo_browser, locale_browser, navigation, auth_lifecycle, account_info, hexagram, security, payment_refund]
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility aggregate only
        shell: bash
        env:
          READING_SELECTED: ${{ needs.select.outputs.reading }}
          READING_RESULT: ${{ needs.reading.result }}
          READING_LIFECYCLE_SELECTED: ${{ needs.select.outputs.reading_lifecycle }}
          READING_LIFECYCLE_RESULT: ${{ needs.reading_lifecycle.result }}
          SEO_STATIC_SELECTED: ${{ needs.select.outputs.seo_static }}
          SEO_STATIC_RESULT: ${{ needs.seo_static.result }}
          SEO_BROWSER_SELECTED: ${{ needs.select.outputs.seo_browser }}
          SEO_BROWSER_RESULT: ${{ needs.public_seo_browser.result }}
          LOCALE_SELECTED: ${{ needs.select.outputs.locale_browser }}
          LOCALE_RESULT: ${{ needs.locale_browser.result }}
          NAV_SELECTED: ${{ needs.select.outputs.navigation }}
          NAV_RESULT: ${{ needs.navigation.result }}
          AUTH_SELECTED: ${{ needs.select.outputs.auth_lifecycle }}
          AUTH_RESULT: ${{ needs.auth_lifecycle.result }}
          ACCOUNT_SELECTED: ${{ needs.select.outputs.account_info }}
          ACCOUNT_RESULT: ${{ needs.account_info.result }}
          HEXAGRAM_SELECTED: ${{ needs.select.outputs.hexagram_detail }}
          HEXAGRAM_RESULT: ${{ needs.hexagram.result }}
          SECURITY_SELECTED: ${{ needs.select.outputs.security }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PAYMENT_SELECTED: ${{ needs.select.outputs.payment_refund }}
          PAYMENT_RESULT: ${{ needs.payment_refund.result }}
        run: |
          set -euo pipefail
          require_domain() {
            selected="$1"
            result="$2"
            name="$3"
            if [ "$selected" = true ]; then
              [ "$result" = success ] || { echo "$name selected but result=$result"; exit 1; }
            else
              [ "$result" = skipped ] || [ "$result" = success ] || { echo "$name unselected but result=$result"; exit 1; }
            fi
          }
          require_domain "$READING_SELECTED" "$READING_RESULT" reading
          require_domain "$READING_LIFECYCLE_SELECTED" "$READING_LIFECYCLE_RESULT" reading_lifecycle
          require_domain "$SEO_STATIC_SELECTED" "$SEO_STATIC_RESULT" seo_static
          require_domain "$SEO_BROWSER_SELECTED" "$SEO_BROWSER_RESULT" seo_browser
          require_domain "$LOCALE_SELECTED" "$LOCALE_RESULT" locale_browser
          require_domain "$NAV_SELECTED" "$NAV_RESULT" navigation
          require_domain "$AUTH_SELECTED" "$AUTH_RESULT" auth_lifecycle
          require_domain "$ACCOUNT_SELECTED" "$ACCOUNT_RESULT" account_info
          require_domain "$HEXAGRAM_SELECTED" "$HEXAGRAM_RESULT" hexagram
          require_domain "$SECURITY_SELECTED" "$SECURITY_RESULT" security
          require_domain "$PAYMENT_SELECTED" "$PAYMENT_RESULT" payment_refund

