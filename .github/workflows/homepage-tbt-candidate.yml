name: Homepage TBT candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  candidate:
    name: Candidate Lighthouse and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Quality gates
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build

      - name: Start candidate production server
        env:
          VERCEL_ENV: production
          PORT: "3000"
          HOSTNAME: 127.0.0.1
        run: |
          bun run start > /tmp/quickiching-candidate.log 2>&1 &
          echo $! > /tmp/quickiching-candidate.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/quickiching-candidate.log
          exit 1

      - name: Install ephemeral browser tooling
        run: |
          bun add --no-save --cache-dir=/tmp/quickiching-bun-cache \
            puppeteer-core@25.1.0 \
            @sparticuz/chromium@149.0.0

      - name: Existing navigation gate
        env:
          PUBLIC_V1_TEST_BASE_URL: http://127.0.0.1:3000
        run: bun run gate:navigation

      - name: Existing Chinese interactive gate
        env:
          CHINESE_INTERACTIVE_GATE_BASE_URL: http://127.0.0.1:3000
        run: bun run gate:interactive:zh

      - name: Browser contract - shared auth request and lazy result chunk
        run: |
          cat > scripts/.perf-homepage-contract.mjs <<'EOF'
          import assert from "node:assert/strict";
          import puppeteer from "puppeteer-core";
          import chromium from "@sparticuz/chromium";
          import { resolveChromeExecutable } from "./browser-runtime.mjs";

          const BASE = "http://127.0.0.1:3000";
          const { executablePath, usingSystemChrome } = await resolveChromeExecutable(chromium);
          const browser = await puppeteer.launch({
            args: usingSystemChrome
              ? ["--no-sandbox", "--disable-dev-shm-usage"]
              : [...chromium.args, "--disable-dev-shm-usage"],
            executablePath,
            headless: true,
          });

          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 900 });
            await page.emulateMediaFeatures([{ name: "prefers-reduced-motion", value: "reduce" }]);

            let userMeCount = 0;
            const scriptUrls = new Set();
            page.on("request", (req) => {
              try {
                const u = new URL(req.url());
                if (u.pathname === "/api/user/me") userMeCount += 1;
              } catch {}
            });
            page.on("response", async (res) => {
              const req = res.request();
              if (req.resourceType() === "script") scriptUrls.add(req.url());
            });

            await page.goto(BASE + "/", { waitUntil: "networkidle0" });
            assert(
              userMeCount <= 1,
              "fresh homepage must request /api/user/me at most once; got " + userMeCount,
            );

            const initialScripts = new Set(scriptUrls);
            const initialResult = await page.$("[data-public-reading-result]");
            assert.equal(initialResult, null, "fresh homepage unexpectedly rendered a completed result");

            // Verify completed-session restoration triggers the result module only when needed.
            await page.evaluate(() => {
              const steps = [
                { lineIndex: 0, lineValue: 7, coinFaces: ["yang", "yin", "yin"], algorithmVersion: "three-coin-v1" },
                { lineIndex: 1, lineValue: 8, coinFaces: ["yang", "yang", "yin"], algorithmVersion: "three-coin-v1" },
                { lineIndex: 2, lineValue: 9, coinFaces: ["yang", "yang", "yang"], algorithmVersion: "three-coin-v1" },
                { lineIndex: 3, lineValue: 6, coinFaces: ["yin", "yin", "yin"], algorithmVersion: "three-coin-v1" },
                { lineIndex: 4, lineValue: 7, coinFaces: ["yang", "yin", "yin"], algorithmVersion: "three-coin-v1" },
                { lineIndex: 5, lineValue: 8, coinFaces: ["yang", "yang", "yin"], algorithmVersion: "three-coin-v1" },
              ];
              const session = {
                schemaVersion: 1,
                started: true,
                id: "perf_restore_contract",
                createdAt: new Date().toISOString(),
                data: { steps },
              };
              sessionStorage.setItem("quickiching:public-v1:three-coin", JSON.stringify(session));
            });
            await page.reload({ waitUntil: "networkidle0" });
            await page.waitForSelector("[data-public-reading-result]", { timeout: 10_000 });

            const afterRestoreScripts = new Set(scriptUrls);
            const newlyLoadedScripts = [...afterRestoreScripts].filter((url) => !initialScripts.has(url));

            console.log("PERF_CONTRACT", JSON.stringify({
              userMeCount,
              initialScriptCount: initialScripts.size,
              afterRestoreScriptCount: afterRestoreScripts.size,
              newlyLoadedScripts,
              restoredResult: true,
            }));
          } finally {
            await browser.close();
          }
          EOF
          node scripts/.perf-homepage-contract.mjs
          rm scripts/.perf-homepage-contract.mjs

      - name: Prepare Lighthouse
        run: |
          mkdir -p perf-candidate /tmp/lighthouse-candidate
          npm install --prefix /tmp/lighthouse-candidate lighthouse@latest
          echo "/tmp/lighthouse-candidate/node_modules/.bin" >> "$GITHUB_PATH"
          /tmp/lighthouse-candidate/node_modules/.bin/lighthouse --version

      - name: Candidate local production (3 runs)
        run: |
          for i in 1 2 3; do
            lighthouse http://127.0.0.1:3000/ \
              --preset=desktop \
              --only-categories=performance \
              --output=json \
              --output-path="perf-candidate/local-run-${i}.json" \
              --save-assets \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-extensions" \
              --quiet
          done

      - name: Print candidate evidence
        run: |
          python3 - <<'PY'
          import glob, json, statistics

          def as_dict(v): return v if isinstance(v, dict) else {}
          def items(a):
              d = as_dict(as_dict(a).get("details"))
              v = d.get("items", [])
              return v if isinstance(v, list) else []
          def metric(audits, key):
              a = as_dict(audits.get(key))
              return {"numericValue": a.get("numericValue"), "displayValue": a.get("displayValue"), "score": a.get("score")}
          def report(path):
              with open(path, encoding="utf-8") as f:
                  d = as_dict(json.load(f))
              a = as_dict(d.get("audits"))
              perf = as_dict(as_dict(d.get("categories")).get("performance"))
              return {
                  "path": path,
                  "performance": perf.get("score"),
                  "fcp": metric(a, "first-contentful-paint"),
                  "lcp": metric(a, "largest-contentful-paint"),
                  "speedIndex": metric(a, "speed-index"),
                  "tbt": metric(a, "total-blocking-time"),
                  "cls": metric(a, "cumulative-layout-shift"),
                  "longTasks": items(a.get("long-tasks")),
                  "mainThread": items(a.get("mainthread-work-breakdown")),
                  "bootup": items(a.get("bootup-time")),
                  "unusedJs": items(a.get("unused-javascript")),
              }

          rs = [report(p) for p in sorted(glob.glob("perf-candidate/local-run-*.json"))]
          for r in rs:
              print("CANDIDATE_RUN", json.dumps(r, ensure_ascii=False))
          tbts = [r["tbt"]["numericValue"] for r in rs if r["tbt"]["numericValue"] is not None]
          perfs = [r["performance"] * 100 for r in rs if r["performance"] is not None]
          print("CANDIDATE_MEDIAN", json.dumps({
              "tbt_ms": statistics.median(tbts) if tbts else None,
              "performance": statistics.median(perfs) if perfs else None,
          }))
          PY

      - name: Upload candidate Lighthouse reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-tbt-candidate
          path: perf-candidate/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/quickiching-candidate.pid ]; then
            kill "$(cat /tmp/quickiching-candidate.pid)" || true
          fi


  auth-network-contract:
    name: Auth-enabled header network contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ENV: production
      APP_ENV: production
      COMMERCIAL_V2_AUTH_ENABLED: "true"
      COMMERCIAL_V2_AI_PREVIEW_ENABLED: "false"
      COMMERCIAL_V2_CHECKOUT_ENABLED: "false"
      COMMERCIAL_V2_WEBHOOK_INGESTION_ENABLED: "false"
      COMMERCIAL_V2_PAID_DEEP_READING_ENABLED: "false"
      COMMERCIAL_V2_RECONCILE_ENABLED: "false"
      AUTH_ADAPTER_MODE: better-auth
      DATABASE_ADAPTER_MODE: postgres
      DATABASE_URL: postgres://quickiching:quickiching@127.0.0.1:5432/quickiching
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
      ANONYMOUS_OWNER_KEYS: v1:0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: https://www.quickiching.com
      APP_BASE_URL: https://www.quickiching.com
      NEXT_PUBLIC_APP_URL: https://www.quickiching.com
      GOOGLE_CLIENT_ID: perf-contract-client
      GOOGLE_CLIENT_SECRET: perf-contract-secret
      RESEND_API_KEY: perf-contract-resend
      EMAIL_FROM: perf-contract@example.com
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build auth-enabled production candidate
        run: bun run build

      - name: Install ephemeral browser tooling
        run: |
          bun add --no-save --cache-dir=/tmp/quickiching-bun-cache \
            puppeteer-core@25.1.0 \
            @sparticuz/chromium@149.0.0

      - name: Start auth-enabled production server
        run: |
          PORT=3001 HOSTNAME=127.0.0.1 bun run start > /tmp/auth-contract-next.log 2>&1 &
          echo $! > /tmp/auth-contract-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/auth-contract-next.log
          exit 1

      - name: Verify exactly one user probe and no drawer refetch
        run: |
          cat > scripts/.auth-network-contract.mjs <<'EOF'
          import assert from "node:assert/strict";
          import puppeteer from "puppeteer-core";
          import chromium from "@sparticuz/chromium";
          import { resolveChromeExecutable } from "./browser-runtime.mjs";

          const { executablePath, usingSystemChrome } = await resolveChromeExecutable(chromium);
          const browser = await puppeteer.launch({
            args: usingSystemChrome
              ? ["--no-sandbox", "--disable-dev-shm-usage"]
              : [...chromium.args, "--disable-dev-shm-usage"],
            executablePath,
            headless: true,
          });

          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 900 });
            let userMeCount = 0;

            await page.setRequestInterception(true);
            page.on("request", (req) => {
              const url = new URL(req.url());
              if (url.pathname === "/api/user/me") {
                userMeCount += 1;
                req.respond({
                  status: 200,
                  contentType: "application/json",
                  body: JSON.stringify({ user: { id: "perf_user", email: "perf@example.com" } }),
                });
                return;
              }
              req.continue();
            });

            await page.goto("http://127.0.0.1:3001/", { waitUntil: "networkidle0" });
            assert.equal(userMeCount, 1, "desktop fresh homepage must issue exactly one /api/user/me request");

            await page.setViewport({ width: 390, height: 844 });
            const menuButton = await page.$('button[aria-controls^="nav-drawer-"]');
            assert(menuButton, "mobile drawer trigger not found");
            await menuButton.click();
            await page.waitForSelector('[role="dialog"]', { visible: true, timeout: 5000 });
            await new Promise((resolve) => setTimeout(resolve, 250));
            assert.equal(userMeCount, 1, "opening mobile drawer must not refetch /api/user/me");

            console.log("AUTH_NETWORK_CONTRACT", JSON.stringify({
              initialUserMeRequests: 1,
              afterDrawerUserMeRequests: userMeCount,
            }));
          } finally {
            await browser.close();
          }
          EOF
          node scripts/.auth-network-contract.mjs
          rm scripts/.auth-network-contract.mjs

      - name: Stop auth contract server
        if: always()
        run: |
          if [ -f /tmp/auth-contract-next.pid ]; then
            kill "$(cat /tmp/auth-contract-next.pid)" || true
          fi
