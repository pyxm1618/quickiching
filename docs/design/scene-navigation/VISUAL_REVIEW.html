<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Quick I Ching · 导航视觉终验</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#17130f;color:#f5e9d3;font:16px/1.6 system-ui}main{max-width:1450px;margin:auto}h1{font-size:25px;margin:0 0 8px}p{color:#c4b9a7}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:8px 16px;border:1px solid #82704a;border-radius:6px;background:#292117;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#6c4b22}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tile{min-width:0;background:#0c0b09;padding:12px}.tile img{display:block;width:100%;height:auto}label{display:block;margin:20px 0}.overlay{position:relative;max-width:100%;background:#000}.overlay img{display:block;width:100%}.overlay img+img{position:absolute;inset:0;opacity:.5}.hint{font-size:13px}a{color:#f5cd7b}</style><main><h1>三个状态 · 导航视觉终验</h1><p>仅对照导航；原首页背景、标题、表单、铜钱和业务实现不在本轮修改范围。左为原效果图，右为真实生产构建截图。纸纹与金属高光存在原切图版本差异，不能用外框或字形偏差代替材质一致结论。</p><nav id="states"><button data-state="default" aria-pressed="true">默认首页</button><button data-state="methods" aria-pressed="false">Other Methods 展开</button><button data-state="info" aria-pressed="false">Info 展开</button><select id="region" aria-label="对照区域"><option value="utility">右上入口</option><option value="brand">品牌</option><option value="scrolls">卷轴与筒身</option><option value="panel">展开面板</option></select></nav><section><div class="tile">原效果图<img id="reference" alt="原效果图的当前导航区域"></div><div class="tile">实际实现<img id="candidate" alt="实际浏览器截图的当前导航区域"></div></section><label>叠图透明度 <input id="blend" type="range" min="0" max="100" value="50"></label><div class="overlay"><img id="under" alt="对照底图"><img id="over" alt="实际实现叠图"></div><p class="hint">视口：默认 1671×941；展开状态 1670×942；DPR 1。菜单文字仍为可选择的 HTML。<a id="full" target="_blank">打开完整截图</a></p></main><script>let state='default';const region=document.querySelector('#region');function render(){if(state==='default'&&region.value==='panel')region.value='scrolls';region.querySelector('[value=panel]').disabled=state==='default';const base=`evidence/2026-10-30/${state}/`;for(const [id,suffix]of[['reference','reference'],['candidate','candidate'],['under','reference'],['over','candidate']])document.getElementById(id).src=base+region.value+'-'+suffix+'.png';document.getElementById('full').href=base+'candidate.png';}for(const b of document.querySelectorAll('[data-state]'))b.onclick=()=>{state=b.dataset.state;for(const n of document.querySelectorAll('[data-state]'))n.setAttribute('aria-pressed',n===b);render()};region.onchange=render;document.querySelector('#blend').oninput=e=>document.querySelector('#over').style.opacity=e.target.value/100;render();</script></html>
